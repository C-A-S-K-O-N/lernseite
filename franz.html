s: `
<div class="note">Die Folie zur Formation war nur als Anhang verlinkt. Die Formation-Regeln unten sind Standardstoff, der Teil "Subjonctif ou indicatif" stammt aus deinem Buch.</div>
<div class="how"><b>So lernst du (ca. 45 min)</b><ol>
<li>Lerne die Bildungsregel und die 9 unregelmässigen Verben.</li>
<li>Lerne die zwei Listen "Subjonctif" und "Indicatif" auswendig, das ist der wichtigste Teil.</li>
<li><a href="#" data-go="trainer/subj">Konjugationstrainer Subjonctif</a>.</li>
<li>Quiz A und die Lückensätze zum Subjonctif.</li></ol></div>

<h3>Bildung</h3>
<p><b>Stamm der 3. Person Plural Präsens (ils) + -e, -es, -e, -ions, -iez, -ent.</b></p>
<p>ils parlent → que je parle · ils finissent → que je finisse · ils attendent → que j'attende · ils partent → que je parte</p>
<div class="tw"><table class="conj">
<tr><th></th><th>que je</th><th>que tu</th><th>qu'il</th><th>que nous</th><th>que vous</th><th>qu'ils</th></tr>
<tr><td>parler</td><td>parle</td><td>parles</td><td>parle</td><td>parlions</td><td>parliez</td><td>parlent</td></tr>
<tr><td>finir</td><td>finisse</td><td>finisses</td><td>finisse</td><td>finissions</td><td>finissiez</td><td>finissent</td></tr>
</table></div>
<p><b>Zwei Stämme:</b> Bei Verben mit wechselndem Stamm kommen nous und vous vom nous-Stamm (wie im Imparfait): que je vienne, que nous venions · que je prenne, que nous prenions · que je boive, que nous buvions · que je doive, que nous devions · que je voie, que nous voyions · que je reçoive, que nous recevions.</p>

<h3>Unregelmässig</h3>
<div class="tw"><table class="conj">
<tr><th></th><th>que je</th><th>que tu</th><th>qu'il</th><th>que nous</th><th>que vous</th><th>qu'ils</th></tr>
<tr><td>être</td><td>sois</td><td>sois</td><td>soit</td><td>soyons</td><td>soyez</td><td>soient</td></tr>
<tr><td>avoir</td><td>aie</td><td>aies</td><td>ait</td><td>ayons</td><td>ayez</td><td>aient</td></tr>
<tr><td>aller</td><td>aille</td><td>ailles</td><td>aille</td><td>allions</td><td>alliez</td><td>aillent</td></tr>
<tr><td>faire</td><td>fasse</td><td>fasses</td><td>fasse</td><td>fassions</td><td>fassiez</td><td>fassent</td></tr>
<tr><td>pouvoir</td><td>puisse</td><td>puisses</td><td>puisse</td><td>puissions</td><td>puissiez</td><td>puissent</td></tr>
<tr><td>savoir</td><td>sache</td><td>saches</td><td>sache</td><td>sachions</td><td>sachiez</td><td>sachent</td></tr>
<tr><td>vouloir</td><td>veuille</td><td>veuilles</td><td>veuille</td><td>voulions</td><td>vouliez</td><td>veuillent</td></tr>
</table></div>
<p>Dazu: qu'il faille (falloir), qu'il pleuve (pleuvoir). Achtung: "soyons", nicht "soyions" (in deinem Notizbuch steht einmal "soyions", das ist falsch).</p>

<h3>Présent oder Subjonctif? Die Grundregel</h3>
<p>Der Sprecher sieht die Handlung als <b>wirklich/sicher → Indicatif</b>. Er sieht sie als <b>nur möglich, gewünscht, gefürchtet → Subjonctif</b>.<br>Il est <b>probable</b> qu'il viendra. · Il est <b>possible</b> qu'il vienne.</p>
<div class="tw"><table>
<tr><th>Subjonctif nach ...</th><th>Indicatif nach ...</th></tr>
<tr><td><b>Wille, Pflicht:</b> il faut que, vouloir que, désirer que, souhaiter que</td><td><b>Meinung, Feststellung, Wissen:</b> penser que, croire que, trouver que, savoir que, être sûr/certain que, voir que, constater que, comprendre que, apprendre que</td></tr>
<tr><td><b>Befehl, Verbot, Erlaubnis, Bitte:</b> ordonner que, interdire que, accepter que, autoriser que, demander que</td><td><b>Sagen:</b> dire que, affirmer que, déclarer que, répondre que, prétendre que</td></tr>
<tr><td><b>Gefühle, Wertung:</b> avoir peur que, regretter que, être content/triste que, trouver curieux que, c'est bien/normal que, il est important que</td><td><b>Hohe Wahrscheinlichkeit:</b> il est probable que, il paraît que, il est évident que, il est sûr que</td></tr>
<tr><td><b>Möglichkeit, Zweifel:</b> il est possible que, il est peu probable que, douter que</td><td><b>espérer que</b> (Achtung, Indicatif!)</td></tr>
<tr><td><b>Konjunktionen:</b> avant que, en attendant que, jusqu'à ce que, à moins que, bien que, quoique, à condition que, pourvu que, pour que, afin que, de sorte que</td><td><b>Konjunktionen:</b> quand, lorsque, pendant que, tant que, alors que, au moment où, après que, aussitôt que, dès que, parce que, puisque, étant donné que, si, même si, comme si</td></tr>
</table></div>
<ul>

<h3>Mit être</h3>
<p>Verben der Bewegung und Zustandsänderung: aller, venir, arriver, partir, entrer, sortir, monter, descendre, rester, tomber, naître, mourir, rentrer, retourner, devenir, revenir. Dazu <b>alle reflexiven Verben</b>: je me suis levé(e), elle s'est excusée.</p>

<div class="tw"><table><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>männlich</td><td>allé</td><td>allés</td></tr><tr><td>weiblich</td><td>allée</td><td>allées</td></tr></table></div>

<ul><li>Abgeschlossene, einmalige Handlung: Hier, je suis allé au cinéma.</li>

{p:"je", i:0, g:"x", pl:false},{p:"tu", i:1, g:"x", pl:false},{p:"il", i:2, g:"m", pl:false},{p:"elle", i:2, g:"f", pl:false},
{p:"nous", i:3, g:"x", pl:true},{p:"vous", i:4, g:"x", pl:true},{p:"ils", i:5, g:"m", pl:true},{p:"elles", i:5, g:"f", pl:true}
];
const AVOIR = ["ai","as","a","avons","avez","ont"], ETRE = ["suis","es","est","sommes","êtes","sont"];
const AVOIR_I = ["avais","avais","avait","avions","aviez","avaient"], ETRE_I = ["étais","étais","était","étions","étiez","étaient"];
const ALLER = ["vais","vas","va","allons","allez","vont"];
const E_IMP = ["ais","ais","ait","ions","iez","aient"], E_FUT = ["ai","as","a","ons","ez","ont"], E_SJ = ["e","es","e","ions","iez","ent"];

function ppForms(v, per) {
  if (v.aux !== "être") return [v.pp];
  const b = v.pp; const forms = [];
  const sing = per.pl === false, plu = per.pl === true;
  const gs = per.g === "x" ? ["m", "f"] : [per.g];
  // vous kann auch Höflichkeitsform Singular sein
  const nums = per.p === "vous" ? [false, true] : [per.pl];
  gs.forEach(g => nums.forEach(pl => forms.push(b + (g === "f" ? "e" : "") + (pl && !b.endsWith("s") ? "s" : ""))));
  return [...new Set(forms)];
}
function conj(v, tense, per) {
  const i = per.i;
  if (tense === "pres") return [v.pres[i]];
  if (tense === "imp") { let st = v.imp || v.pres[3].replace(/ons$/, ""); const e = E_IMP[i];
    if (e[0] === "i") { if (st.endsWith("ge")) st = st.slice(0, -1); if (st.endsWith("ç")) st = st.slice(0, -1) + "c"; }
    return [st + e]; }
  if (tense === "fut") return [v.fut + E_FUT[i]];
  if (tense === "fp") return [ALLER[i] + " " + v.inf];
  if (tense === "subj") { if (v.sjf) return [v.sjf[i]]; const st = (i === 3 || i === 4) ? v.sj[1] : v.sj[0]; return [st + E_SJ[i]]; }
  if (tense === "pc" || tense === "pqp") { const A = tense === "pc" ? (v.aux === "être" ? ETRE : AVOIR) : (v.aux === "être" ? ETRE_I : AVOIR_I); return ppForms(v, per).map(f => A[i] + " " + f); }
}
const TENSES = {pres:"Présent", subj:"Subjonctif", pc:"Passé composé", imp:"Imparfait", pqp:"Plus-que-parfait", fut:"Futur simple", fp:"Futur proche"};

const deacc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
function norm(s) {
  s = String(s).toLowerCase().replace(/[’`´]/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?,;]+$/, "").trim();
  s = s.replace(/^(que |qu')/, "").replace(/^(je |j'|tu |il |elle |on |nous |vous |ils |elles )/, "");
  return s.replace(/\s*'\s*/g, "'").trim();
}
function normFull(s) { return String(s).toLowerCase().replace(/[’`´]/g, "'").replace(/[«»"]/g, "").replace(/\s+/g, " ").trim().replace(/[.!?;]+$/, "").replace(/\s*'\s*/g, "'").replace(/\s*,\s*/g, ", ").trim(); }
function checkFull(input, accepted) { const n = normFull(input); const acc = accepted.map(normFull); if (acc.includes(n)) return "ok"; if (n && acc.map(deacc).includes(deacc(n))) return "accent"; return "no"; }
function check(input, accepted) {
  const n = norm(input); const acc = accepted.map(norm);
  if (acc.includes(n)) return "ok";
  if (n && acc.map(deacc).includes(deacc(n))) return "accent";
  return "no";
}

  function show() {
    const it = items[i];
    app().innerHTML = `<p class="crumb">${back} / ${esc(title)}</p><div class="qhead"><span>${i + 1} von ${items.length}</span><span>${right} richtig</span></div>
    <div class="bar"><div style="width:${i / items.length * 100}%"></div></div>
    <div class="qcard"><p class="small">${esc(it.label || "")}</p><h2>${it.html}</h2>
    <form id="f" autocomplete="off"><input id="ans" class="ans" autocapitalize="off" spellcheck="false" placeholder="Antwort eintippen"><button class="btn">Prüfen</button></form>
    <div class="acc">${["é", "è", "ê", "à", "â", "ç", "î", "ï", "ô", "û", "ù", "ë"].map(c => `<button type="button" data-c="${c}">${c}</button>`).join("")}</div><div id="fb"></div></div>`;
    const inp = $("#ans"); inp.focus();
    app().querySelectorAll("[data-c]").forEach(b => b.onclick = () => { const p = inp.selectionStart ?? inp.value.length; inp.value = inp.value.slice(0, p) + b.dataset.c + inp.value.slice(inp.selectionEnd ?? p); inp.focus(); inp.setSelectionRange(p + 1, p + 1); });
    $("#f").onsubmit = e => { e.preventDefault(); if ($("#f").dataset.done) { next(); return; } $("#f").dataset.done = 1;
      const r = check(inp.value, it.a); const ok = r === "ok"; if (ok) right++;
      log.push({ it, ok, given: inp.value }); inp.disabled = true;
      $("#fb").innerHTML = `<div class="fb ${ok ? "y" : "n"}"><b>${ok ? "Richtig." : r === "accent" ? "Fast: Akzente prüfen!" : "Falsch."}</b> ${ok && it.a.length < 2 ? "" : "Lösung: <b>" + esc(it.a.join(" / ")) + "</b>"}${it.hint ? `<br><span class="small">${esc(it.hint)}</span>` : ""}</div><button class="btn" id="nx">${i + 1 < items.length ? "Weiter" : "Auswertung"}</button>`;
      $("#nx").focus(); $("#nx").onclick = next; };
  }
  function next() { i++; i < items.length ? show() : end(); }
  function end() { const score = Math.round(right / items.length * 100); onEnd(score, log);
    app().innerHTML = `<p class="crumb">${back} / ${esc(title)}</p><h1>${score} %</h1><p class="lead">${right} von ${items.length} richtig · ungefähr Note ${noteOf(right / items.length)}.</p>
    <p><a class="btn" href="#${window.__r}">Neue Runde</a> <a class="btn ghost" href="#plan">Plan</a></p>
    ${log.some(l => !l.ok) ? `<h2>Deine Fehler</h2>${log.filter(l => !l.ok).map(l => `<div class="rev">${l.it.html}<br><span class="n">Deine Antwort: ${esc(l.given || "leer")}</span><br><span class="y">Richtig: ${esc(l.it.a.join(" / "))}</span>${l.it.hint ? `<br><span class="small">${esc(l.it.hint)}</span>` : ""}</div>`).join("")}` : ""}`; }
  show();
}

// ---------- Konjugationstrainer ----------
const TRAIN_MODES = {
  pres: { label: "Présent", t: ["pres"] }, subj: { label: "Subjonctif", t: ["subj"] }, pc: { label: "Passé composé", t: ["pc"] },
  imp: { label: "Imparfait", t: ["imp"] }, pqp: { label: "Plus-que-parfait", t: ["pqp"] }, fut: { label: "Futur", t: ["fut", "fp"] },
  past: { label: "Alle Vergangenheiten", t: ["pc", "imp", "pqp"] }, all: { label: "Alle Zeiten", t: ["pres", "subj", "pc", "imp", "pqp", "fut", "fp"] },
  hard: { label: "Schwer: nur unregelmässige Verben, alle Zeiten", t: ["pres", "subj", "pc", "imp", "pqp", "fut", "subj", "pc"], hard: true }
};
function viewTrainerList() {
  app().innerHTML = `<h1>Konjugationstrainer</h1><p class="lead">Du bekommst Person, Verb und Zeit und tippst die Form ein (ohne Pronomen). Jede Runde: 12 neue Aufgaben aus ${VERBS.length} Verben. Akzente zählen, mit den Knöpfen unter dem Feld kannst du sie einfügen.</p>
  <div class="list">${Object.entries(TRAIN_MODES).map(([k, m]) => { const b = best("tr_" + k); return `<a class="row" href="#trainer/${k}">${m.label}<span class="go">${b === null ? "" : "Bestwert " + b + " %"} →</span></a>`; }).join("")}</div>`;
}
const vowel = s => /^[aeéèêiîoôuûh]/i.test(s);
function makeItem(v, tense, per) {
  const forms = conj(v, tense, per);
  let pron = per.p; if (pron === "je" && vowel(forms[0])) pron = "j'";
  const que = tense === "subj" ? (/^[aeiouéèê]/.test(per.p) ? "qu'" : "que ") : "";
  const g = v.aux === "être" && (tense === "pc" || tense === "pqp") && per.g === "x" ? " (m oder f)" : "";
  return { html: `<span class="pron">${que}${pron}</span> … <span class="small">(${esc(v.inf)})</span>`, label: TENSES[tense] + g, a: forms, hint: TENSE_HINT[tense] + (v.aux === "être" && (tense === "pc" || tense === "pqp") ? " Dieses Verb steht mit être." : "") };
}
function startTrainer(mode) {
  const m = TRAIN_MODES[mode]; const items = [];
  const pool = m.hard ? VERBS.filter(x => x.g !== "reg") : VERBS;
  for (let k = 0; k < (m.hard ? 15 : 12); k++) { const tense = pick(m.t); let v = pick(pool); if ((tense === "pc" || tense === "pqp") && k % 3 === 0) v = pick(pool.filter(x => x.aux === "être").length ? pool.filter(x => x.aux === "être") : VERBS); items.push(makeItem(v, tense, pick(PERS))); }
  typeRound(items, "Trainer " + m.label, `<a href="#trainer">Trainer</a>`, score => { const b = best("tr_" + mode); if (b === null || score > b) S.set("best_tr_" + mode, score); });
}

// ---------- Lückensätze ----------
function viewSatzList() {
  app().innerHTML = `<h1>Lückensätze</h1><p class="lead">Wie in der Prüfung: Satz lesen, Zeit bestimmen, Verb richtig einsetzen. Pro Runde 8 Sätze in neuer Reihenfolge.</p>
  <div class="list">${TOPICS.map(t => { const b = best("satz_" + t.id); return `<a class="row" href="#satz/${t.id}">${t.n} ${t.short}<span class="go">${b === null ? "" : "Bestwert " + b + " %"} →</span></a>`; }).join("")}
  <a class="row" href="#satz/mix">Gemischt aus allen Themen<span class="go">${best("satz_mix") === null ? "" : "Bestwert " + best("satz_mix") + " %"} →</span></a></div>`;
}
function satzItem(s, t) { return { html: esc(s.q).replace("___", '<span class="gap">______</span>'), label: topic(t).short, a: s.a }; }
function startSatz(t) {
  const pool = t === "mix" ? TOPICS.flatMap(x => SATZ[x.id].map(s => satzItem(s, x.id))) : SATZ[t].map(s => satzItem(s, t));
  typeRound(shuffle(pool).slice(0, t === "mix" ? 12 : 8), "Lückensätze " + (t === "mix" ? "gemischt" : topic(t).short), `<a href="#satz">Lückensätze</a>`, score => { const b = best("satz_" + t); if (b === null || score > b) S.set("best_satz_" + t, score); });
}

// ---------- Simulation ----------
function viewSim() {
  const hist = S.get("simhist", []);
  app().innerHTML = `<h1>Prüfungssimulation</h1><p class="lead">Wie eine echte Prüfung: 14 Lückensätze aus allen Themen, 10 Formen ohne Kontext und 8 Multiple-Choice-Fragen zum Gebrauch. Jedes Mal andere Aufgaben. Timer 45 min, ohne Unterlagen.</p>
  <p><button class="btn" id="go">Simulation starten</button></p>
  ${hist.length ? `<h2>Bisherige Simulationen</h2><div class="tw"><table><tr><th>Datum</th><th>Resultat</th><th>Note ca.</th></tr>${hist.map(h => `<tr><td>${h.d}</td><td>${h.p} %</td><td>${h.n}</td></tr>`).join("")}</table></div>` : ""}`;
  $("#go").onclick = runSim;
}
function runSim() {
  const sat = shuffle(TOPICS.flatMap(x => SATZ[x.id].map(s => satzItem(s, x.id)))).slice(0, 14);
  const forms = []; const tens = ["pres", "subj", "pc", "imp", "pqp", "fut", "fp", "subj", "pc", "fut"];
  shuffle(tens).forEach(te => { let v = pick(VERBS); if ((te === "pc" || te === "pqp") && Math.random() < .5) v = pick(VERBS.filter(x => x.aux === "être")); forms.push(makeItem(v, te, pick(PERS))); });
  const mc = shuffle(TOPICS.flatMap(x => allQ(x.id))).slice(0, 8);
  const start = Date.now();
  app().innerHTML = `<h1>Simulation</h1><div class="timer" id="tm">45:00</div>
  <h2>Teil 1: Setze das Verb in der richtigen Form ein</h2>${sat.map((it, i) => `<div class="simq"><b>${i + 1}.</b> ${it.html}<br><input class="ans sm" data-s="${i}" autocapitalize="off" spellcheck="false"></div>`).join("")}
  <h2>Teil 2: Konjugiere</h2>${forms.map((it, i) => `<div class="simq"><b>${i + 1}.</b> <span class="small">${esc(it.label)}</span> ${it.html}<br><input class="ans sm" data-f="${i}" autocapitalize="off" spellcheck="false"></div>`).join("")}
  <h2>Teil 3: Wähle</h2>${mc.map((q, i) => { const o = shuffle(q.a.map((x, k) => ({ x, ok: k === 0 }))); q._o = o; return `<div class="simq"><b>${i + 1}. ${esc(q.q)}</b>${o.map((x, k) => `<label class="sopt"><input type="radio" name="m${i}" value="${k}"> ${esc(x.x)}</label>`).join("")}</div>`; }).join("")}
  <p><button class="btn" id="sub">Abgeben</button></p>`;
  window.__timer = setInterval(() => { const s = Math.max(0, 2700 - Math.floor((Date.now() - start) / 1000)); const el = $("#tm"); if (el) el.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 1000);
  $("#sub").onclick = () => {
    clearInterval(window.__timer); window.__timer = null;
    const rows = []; let pts = 0, max = 0;
    sat.forEach((it, i) => { const v = app().querySelector(`[data-s="${i}"]`).value; const ok = check(v, it.a) === "ok"; max++; if (ok) pts++; rows.push({ html: it.html, ok, given: v, sol: it.a.join(" / "), lab: it.label }); });
    forms.forEach((it, i) => { const v = app().querySelector(`[data-f="${i}"]`).value; const ok = check(v, it.a) === "ok"; max++; if (ok) pts++; rows.push({ html: `${esc(it.label)}: ${it.html}`, ok, given: v, sol: it.a.join(" / "), lab: it.label }); });
    const wrongIds = [], okIds = [];
    mc.forEach((q, i) => { const r = app().querySelector(`input[name=m${i}]:checked`); const ok = r && q._o[+r.value].ok; max++; if (ok) { pts++; okIds.push(q.id); } else wrongIds.push(q.id); rows.push({ html: esc(q.q), ok, given: r ? q._o[+r.value].x : "", sol: q.a[0], lab: topic(q.t).short }); });
    saveWrong(mc, wrongIds, okIds);
    const pct = Math.round(pts / max * 100), n = noteOf(pts / max);
    const h = S.get("simhist", []); const d = new Date(); h.unshift({ d: `${d.getDate()}.${d.getMonth() + 1}. ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`, p: pct, n }); S.set("simhist", h.slice(0, 10));
    app().innerHTML = `<h1>${pct} %</h1><p class="lead">${pts} von ${max} Punkten in ${Math.round((Date.now() - start) / 60000)} min · geschätzte Note ${n}. ${pct >= 92 ? "Du bist ready." : pct >= 80 ? "Fast. Fehler unten nachlernen, dann Trainer 'alle Zeiten'." : "Kapitel mit den meisten Fehlern nochmals lesen, Trainer machen, dann neue Simulation."}</p>
    <h2>Fehler</h2>${rows.filter(r => !r.ok).map(r => `<div class="rev">${r.html} <span class="small">(${esc(r.lab)})</span><br><span class="n">Deine Antwort: ${esc(r.given || "leer")}</span><br><span class="y">Richtig: ${esc(r.sol)}</span></div>`).join("") || "<p>Keine Fehler.</p>"}
    <p><a class="btn" href="#sim">Zurück</a></p>`;
  };
}

// ---------- Übungen (schwer) ----------
const KLAB = { gap: "Setze ein", fix: "Korrigiere den Fehler (schreib nur die richtige Form)", trans: "Schreib den ganzen Satz", text: "Setze alle Verben ein" };
function viewUebList() {
  app().innerHTML = `<h1>Übungen (schwer)</h1><p class="lead">Nach jeder Theorie-Lektion: drei Übungsblätter pro Thema. Übung 1 = schwierige Lückensätze, Übung 2 = Text mit mehreren Lücken + Fehler korrigieren, Übung 3 = ganze Sätze umformen. Alles eintippen, dann alles auf einmal prüfen. Ziel: jedes Blatt über 90 %.</p>
  <div class="tw"><table><tr><th>Thema</th><th></th></tr>${TOPICS.map(t => `<tr><td>${t.n} ${t.short}</td><td class="btns">${[1, 2, 3].map(n => { const b = best(`ueb_${t.id}_${n}`); return `<a class="btn sm ${b === null ? "" : b >= 90 ? "good" : "bad"}" href="#ueb/${t.id}/${n}">Ü${n}${b === null ? "" : " · " + b + "%"}</a>`; }).join("")}</td></tr>`).join("")}</table></div>`;
}
function viewUeb(t, n) {
  const sheet = UEB[t][n - 1]; let idx = 0;
  const field = (cls = "") => `<input class="ans sm ${cls}" data-i="${idx++}" autocapitalize="off" spellcheck="false">`;
  const blanks = []; // {a, el}
  const body = sheet.items.map((it, k) => {
    if (it.k === "text") { const parts = it.q.split("___"); let h = ""; parts.forEach((p, j) => { h += esc(p); if (j < parts.length - 1) { blanks.push({ a: it.a[j], full: false }); h += field("inl"); } }); return `<div class="simq"><span class="small">${KLAB.text}</span><p class="txt">${h}</p></div>`; }
    blanks.push({ a: it.a, full: it.k === "trans", h: it.h });
    const q = it.k === "gap" ? esc(it.q).replace("___", '<span class="gap">______</span>') : esc(it.q);
    return `<div class="simq"><span class="small">${KLAB[it.k]}</span><br><b>${k + 1}.</b> ${q}<br>${field(it.k === "trans" ? "wide" : "")}<div class="res"></div></div>`;
  }).join("");
  app().innerHTML = `<p class="crumb"><a href="#ueb">Übungen</a> / ${topic(t).short}</p><h1>${topic(t).short} · ${sheet.t}</h1>
  <div class="tabs">${[1, 2, 3].map(m => `<a href="#ueb/${t}/${m}" class="${m === n ? "on" : ""}">Übung ${m}</a>`).join("")}</div>
  <p class="small">Akzente: ${["é", "è", "ê", "à", "â", "ç", "î", "ô", "û", "ù", "ë", "«", "»"].map(c => `<button type="button" class="ch" data-c="${c}">${c}</button>`).join("")} (fügt ins zuletzt angeklickte Feld ein)</p>
  ${body}<p><button class="btn" id="chk">Alles prüfen</button></p><div id="sum"></div>`;
  let last = null; app().querySelectorAll("input.ans").forEach(i => i.addEventListener("focus", () => last = i));
  app().querySelectorAll(".ch").forEach(b => b.onclick = () => { if (!last) return; const p = last.selectionStart ?? last.value.length; last.value = last.value.slice(0, p) + b.dataset.c + last.value.slice(last.selectionEnd ?? p); last.focus(); last.setSelectionRange(p + 1, p + 1); });
  $("#chk").onclick = () => {
    let right = 0;
    app().querySelectorAll("input.ans").forEach(inp => { const b = blanks[+inp.dataset.i]; const r = b.full ? checkFull(inp.value, b.a) : checkFull(inp.value, b.a);
      const ok = r === "ok"; if (ok) right++; inp.classList.remove("okk", "nok"); inp.classList.add(ok ? "okk" : "nok");
      const res = inp.parentElement.querySelector(".res");
      const msg = ok ? "" : `${r === "accent" ? "Fast: Akzente!" : "Lösung:"} <b>${esc(b.a.join(" / "))}</b>${b.h ? `<br><span class="small">${esc(b.h)}</span>` : ""}`;
      if (res) res.innerHTML = ok ? '<span class="y">richtig</span>' : `<span class="n">${msg}</span>`;
      else { inp.title = b.a.join(" / "); let s = inp.nextElementSibling; if (!s || !s.classList.contains("sol")) { s = document.createElement("span"); s.className = "sol"; inp.after(s); } s.innerHTML = ok ? "" : ` <span class="n">(${esc(b.a.join(" / "))})</span>`; } });
    const score = Math.round(right / blanks.length * 100); const k = `ueb_${t}_${n}`; const b = best(k); if (b === null || score > b) S.set("best_" + k, score);
    $("#sum").innerHTML = `<div class="fb ${score >= 90 ? "y" : "n"}"><b>${right} von ${blanks.length} richtig (${score} %).</b> ${score >= 90 ? "Sehr gut." : "Lies die Lösungen, schreib die falschen Formen 3-mal ab und mach das Blatt morgen nochmals."}</div>${n < 3 ? `<a class="btn" href="#ueb/${t}/${n + 1}">Weiter zu Übung ${n + 1}</a>` : `<a class="btn" href="#quiz/${t}/A">Weiter zum Quiz</a>`}`;
  };
}
