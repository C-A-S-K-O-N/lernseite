<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
body{margin:0}
main{max-width:880px;margin:0 auto;padding:28px 20px 90px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;display:flex;gap:6px;align-items:center;margin-bottom:46px}
.brand i{width:9px;height:9px;border-radius:50%;display:inline-block}
.headline{font-family:var(--display);font-weight:700;font-size:clamp(40px,8.5vw,84px);line-height:.98;letter-spacing:-.035em;margin:0 0 18px;max-width:14ch}
.headline em{font-style:normal;color:var(--next)}
.sub{font-size:18px;color:#3B3F48;margin:0 0 44px;max-width:56ch}
h2{font-family:var(--display);font-size:22px;font-weight:650;margin:40px 0 14px;letter-spacing:-.01em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 20px}
.slot{display:grid;grid-template-columns:104px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #EFF1F4}
.slot:last-child{border-bottom:none}
.slot .t{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.slot .w{display:flex;align-items:baseline;gap:10px}
.slot .d{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(-1px)}
.slot .f{font-size:13px;color:var(--mute)}
.slot.done{opacity:.45}
.slot.live .t::after{content:"jetzt";display:inline-block;margin-left:8px;font-family:var(--text);font-size:11.5px;font-weight:600;color:#fff;background:var(--ink);border-radius:10px;padding:1px 7px;vertical-align:2px}
.start{font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;white-space:nowrap}
.start:hover{border-color:var(--ink)}
.exam{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:20px 0 20px 18px;border-bottom:1px solid #EFF1F4;text-decoration:none;color:var(--ink);position:relative}
.exam:last-child{border-bottom:none}
.exam::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:3px;border-radius:3px;background:var(--c)}
.exam .n{font-family:var(--display);font-size:22px;font-weight:650;letter-spacing:-.01em}
.exam .m{font-size:14.5px;color:var(--mute);margin-top:2px}
.exam .pr{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--mute)}
.exam .pr span{flex:0 1 220px;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.exam .pr span b{display:block;height:5px;background:var(--c);border-radius:5px}
.exam .cd{text-align:right;font-family:var(--display);line-height:1}
.exam .cd b{display:block;font-size:56px;font-weight:700;letter-spacing:-.04em;color:var(--c)}
.exam .cd small{font-family:var(--text);font-size:13px;color:var(--mute)}
.exam:hover .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--c)}
.dayh{margin:22px 0 6px;font-family:var(--display);font-weight:650;font-size:16px}
.empty{padding:18px 0;color:var(--mute)}
.foot{margin-top:46px;font-size:13.5px;color:var(--mute);max-width:60ch}
@media (max-width:600px){
  .brand{margin-bottom:30px}
  .slot{grid-template-columns:78px 1fr;row-gap:6px}
  .slot .start{grid-column:2;justify-self:start}
  .exam .cd b{font-size:42px}
}
</style>
</head>
<body>
<main>
<div class="brand" id="brand">Lernseite</div>
<h1 class="headline" id="hl"></h1>
<p class="sub" id="sub"></p>

<h2 id="todayH">Heute</h2>
<div class="panel" id="today"></div>

<h2>Prüfungen</h2>
<div class="panel" id="exams"></div>

<h2>Diese Woche</h2>
<div id="week"></div>

<p class="foot">Fächer verschwinden nach der Prüfung automatisch. Häkchen und Resultate speichert dein Browser, sie gelten also pro Gerät. Die Zeiten stimmen mit deinem Google Kalender überein.</p>
</main>
<script>
const SUBJECTS = [
 {key:"fr", name:"Französisch", file:"franz.html", date:"2026-11-24", when:"Di 24.11.", desc:"Présent, Subjonctif, Passé composé, Imparfait, Plus-que-parfait, Futur", c:"#2F5BD3", store:"frhs26_"},
 {key:"ef", name:"EF Sport", file:"ef.html", date:"2026-11-25", when:"Mi 25.11.", desc:"Energiebereitstellung und motorische Fähigkeiten, 60 min schriftlich", c:"#0E9F6E", store:"efsport_"},
 {key:"ma", name:"Mathe mündlich", file:"mathe.html", date:"2026-11-25", when:"Mi 25.11.", desc:"Differentialrechnung 2 bis 4 und Stochastik 2, 15 min ohne Hilfsmittel", c:"#7048E8", store:"mamue_"}
];
// [Datum, Start, Ende, Fach, Inhalt]
const BLOCKS = [
 ["2026-11-18","19:30","20:15","ef","Energiebereitstellung"],
 ["2026-11-18","20:30","21:00","fr","Présent"],
 ["2026-11-19","17:05","17:50","fr","Passé composé und Imparfait"],
 ["2026-11-19","19:30","20:30","ef","Laktat und Schwellen"],
 ["2026-11-20","08:30","10:30","ma","Im Zug: Ableitung und alle Ableitungsregeln"],
 ["2026-11-20","10:45","11:45","fr","Im Zug: PC oder Imparfait, Plus-que-parfait"],
 ["2026-11-20","12:00","13:00","ef","Im Zug: Ausdauer"],
 ["2026-11-20","13:15","13:45","ma","Im Zug: Karteikarten Mathe, danach Trainer Französisch"],
 ["2026-11-21","10:00","11:00","ef","Koordination und Schnelligkeit"],
 ["2026-11-21","11:15","12:15","fr","Futur"],
 ["2026-11-21","14:00","15:00","ma","sin, cos, e, ln"],
 ["2026-11-22","10:00","11:00","ef","Kraft und Beweglichkeit"],
 ["2026-11-22","11:15","12:15","fr","Subjonctif"],
 ["2026-11-22","14:00","15:00","ma","Stochastik"],
 ["2026-11-23","16:30","17:15","ma","Im Auto: Präsentationen und Prüferfragen"],
 ["2026-11-23","17:30","18:45","ef","Übungstag"],
 ["2026-11-23","19:15","20:15","fr","Generalprobe"],
 ["2026-11-24","07:15","07:30","fr","Merkblatt vor der Prüfung"],
 ["2026-11-24","17:30","19:00","ef","Generalprobe"],
 ["2026-11-24","19:15","20:15","ma","Generalprobe mündlich"],
 ["2026-11-25","07:00","07:15","ef","Merkblatt vor der Prüfung"],
 ["2026-11-25","07:15","07:35","ma","Merkblatt und Präsentation laut"]
];
const pad = n => String(n).padStart(2, "0");
const now = new Date();
const today = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
const days = d => Math.round((new Date(d + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000);
const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const dayName = d => { const x = new Date(d + "T00:00:00"); return `${WD[x.getDay()]}, ${x.getDate()}.${x.getMonth() + 1}.`; };
const sub = k => SUBJECTS.find(s => s.key === k);
const pct = s => { try { const v = localStorage.getItem(s.store + "planpct"); return v === null ? 0 : +JSON.parse(v); } catch (e) { return 0; } };

const active = SUBJECTS.filter(s => s.date >= today).sort((a, b) => a.date.localeCompare(b.date));
document.getElementById("brand").innerHTML = active.map(s => `<i style="background:${s.c}"></i>`).join("") + " Lernseite";

// Headline
const hl = document.getElementById("hl"), sb = document.getElementById("sub");
if (!active.length) { hl.textContent = "Gerade keine Prüfung in Sicht."; sb.textContent = "Schick den nächsten Prüfungsstoff in den Chat, dann kommt das Fach hierher."; }
else { const n = active[0], d = days(n.date); document.documentElement.style.setProperty("--next", n.c);
  hl.innerHTML = d === 0 ? `Heute ist <em>${n.name}</em>.` : d === 1 ? `Morgen ist <em>${n.name}</em>.` : `Noch ${d} Tage bis <em>${n.name}</em>.`;
  const rest = active.slice(1); sb.textContent = rest.length ? `Danach ${rest.map(s => `${s.name} am ${s.when.replace(/\.$/, "")}`).join(" und ")}.` : "Das ist die letzte Prüfung in dieser Runde."; }

// Blöcke
const relevant = BLOCKS.filter(b => active.some(s => s.key === b[3]));
const slot = b => { const s = sub(b[3]); const st = b[0] < today || (b[0] === today && b[2] <= hm) ? "done" : (b[0] === today && b[1] <= hm && hm < b[2]) ? "live" : "";
  return `<div class="slot ${st}"><div class="t">${b[1]}</div><div><div class="w"><i class="d" style="background:${s.c}"></i><div><div>${b[4]}</div><div class="f">${s.name}, bis ${b[2]}</div></div></div></div><a class="start" href="${s.file}">Öffnen</a></div>`; };
const tb = relevant.filter(b => b[0] === today);
document.getElementById("today").innerHTML = tb.length ? tb.map(slot).join("") : `<p class="empty">Heute ist kein Lernblock geplant. Ein Zufallsquiz geht trotzdem immer.</p>`;
document.getElementById("todayH").textContent = `Heute, ${dayName(today)}`;

// Prüfungen
document.getElementById("exams").innerHTML = active.length ? active.map(s => { const d = days(s.date), p = pct(s);
  return `<a class="exam" href="${s.file}" style="--c:${s.c}"><div><div class="n">${s.name}</div><div class="m">${s.when}, ${s.desc}</div><div class="pr"><span><b style="width:${p}%"></b></span>${p} % vom Lernplan erledigt</div></div><div class="cd"><b>${d}</b><small>${d === 0 ? "heute" : d === 1 ? "Tag" : "Tage"}</small></div></a>`; }).join("") : `<p class="empty">Keine Prüfungen geplant.</p>`;

// Woche
const future = relevant.filter(b => b[0] > today);
const byDay = {}; future.forEach(b => (byDay[b[0]] = byDay[b[0]] || []).push(b));
document.getElementById("week").innerHTML = Object.keys(byDay).length ? Object.keys(byDay).sort().map(d => `<div class="dayh">${dayName(d)}</div><div class="panel">${byDay[d].map(slot).join("")}</div>`).join("") : `<p class="empty">Keine weiteren Blöcke diese Woche.</p>`;
</script>
</body>
</html>
