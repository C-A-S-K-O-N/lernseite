<body>

<script>

const EXAM_DATE = "2026-11-25";
const fr = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sq = x => `√<span class="ol">${x}</span>`;
const LIM = `lim<sub>h→0</sub>`;

const TOPICS = [
{id:"d2", n:1, title:"Die Ableitung (Diff. 2)", short:"Ableitung"},
{id:"d3", n:2, title:"Weitere Ableitungsregeln (Diff. 3)", short:"Ableitungsregeln"},
{id:"d4", n:3, title:"Weitere Ableitungsfunktionen (Diff. 4)", short:"sin, e, ln"},
{id:"st", n:4, title:"Stochastik 2 (bis S. 14) + Einstiegsaufgaben", short:"Stochastik"}
];

const CHAPTERS = {
d2: `
<div class="how"><b>So lernst du (ca. 40 min)</b><ol><li>Lies das Kapitel und sag jede Definition laut, ohne hinzuschauen.</li><li>Rechne die Herleitung von (x²)' und (x³)' mit der h-Methode auf Papier.</li><li><a href="#" data-go="cards/d2">Karteikarten</a>, dann <a href="#" data-go="ueb/d1">Übungsblatt 1</a>.</li></ol></div>
<h3>Differenzenquotient und Differentialquotient</h3>
<p><b>Differenzenquotient</b> = Steigung der <b>Sekante</b> durch (x₀, f(x₀)) und (x, f(x)): ${fr("f(x) − f(x₀)", "x − x₀")} oder ${fr("f(x₀+h) − f(x₀)", "h")}</p>
<p><b>Differentialquotient (Ableitung an der Stelle x₀)</b> = Steigung der <b>Tangente</b>: Lässt man x gegen x₀ (bzw. h gegen 0) gehen, wird die Sekante zur Tangente.</p>
<p class="formula">f'(x₀) = lim<sub>x→x₀</sub> ${fr("f(x) − f(x₀)", "x − x₀")} = ${LIM} ${fr("f(x₀+h) − f(x₀)", "h")}</p>
<p>f heisst <b>differenzierbar</b> an der Stelle x₀, wenn dieser Grenzwert existiert. Gegenbeispiel: f(x) = |x| hat bei x = 0 einen Knick. Von links ist die Steigung −1, von rechts +1, es gibt keine eindeutige Tangente → nicht differenzierbar.</p>
<h3>Ableitungsfunktion und graphisches Ableiten</h3>
<p>Ordnet man jeder Stelle x die Steigung f'(x) zu, erhält man die <b>Ableitungsfunktion f'</b>. Graphisches Differenzieren:</p>
<div class="tw"><table><tr><th>Graph von f</th><th>Graph von f'</th></tr>
<tr><td>Extrempunkt (Hoch-/Tiefpunkt), waagrechte Tangente</td><td>Nullstelle</td></tr>
<tr><td>Wendepunkt (stärkste Steigung)</td><td>Extrempunkt</td></tr>
<tr><td>f steigt</td><td>f' liegt über der x-Achse (f' > 0)</td></tr>
<tr><td>f fällt</td><td>f' liegt unter der x-Achse (f' < 0)</td></tr>
<tr><td>Polynom vom Grad n</td><td>Polynom vom Grad n − 1</td></tr></table></div>
<h3>Rechnerisch ableiten (h-Methode)</h3>
<p>Beispiel f(x) = x² + 2x: ${fr("(x+h)² + 2(x+h) − x² − 2x", "h")} = ${fr("2xh + h² + 2h", "h")} = 2x + h + 2 → <b>f'(x) = 2x + 2</b></p>
<h3>Elementare Ableitungsregeln</h3>
<div class="tw"><table><tr><th>Regel</th><th>Formel</th><th>Beispiel</th></tr>
<tr><td>Konstante</td><td>f(x) = c → f'(x) = 0</td><td>(17)' = 0, (π²)' = 0</td></tr>
<tr><td>Potenzregel</td><td>(xⁿ)' = n·xⁿ⁻¹</td><td>(x⁷)' = 7x⁶</td></tr>
<tr><td>Faktorregel</td><td>(c·f(x))' = c·f'(x)</td><td>(3x⁵)' = 15x⁴</td></tr>
<tr><td>Summenregel</td><td>(f(x) + g(x))' = f'(x) + g'(x)</td><td>(x⁴ + x²)' = 4x³ + 2x</td></tr></table></div>
<p><b>Herleitung Potenzregel:</b> (x+h)ⁿ = xⁿ + n·xⁿ⁻¹·h + (Terme mit h², h³, ...). Im Differenzenquotient fällt xⁿ weg, man teilt durch h, und für h → 0 bleibt nur n·xⁿ⁻¹. Binomische Formeln: (x+h)² = x² + 2xh + h², (x+h)³ = x³ + 3x²h + 3xh² + h³.</p>
<p><b>Herleitung Summenregel:</b> ${LIM} ${fr("f(x+h) + g(x+h) − f(x) − g(x)", "h")} = ${LIM} ${fr("f(x+h) − f(x)", "h")} + ${LIM} ${fr("g(x+h) − g(x)", "h")} = f'(x) + g'(x)</p>
`,
d3: `
<div class="how"><b>So lernst du (ca. 50 min)</b><ol><li>Lerne die vier Regeln als Formel und als Merksatz.</li><li>Leite die Quotientenregel aus der Produktregel selbst her (Papier).</li><li><a href="#" data-go="ueb/d2">Übungsblatt 2</a> und <a href="#" data-go="quiz/B">Quiz B</a>.</li></ol></div>
<h3>Ableitung von √x und 1/x</h3>
<p>(${sq("x")})' = ${fr("1", "2" + sq("x"))} &nbsp;&nbsp; (${fr("1", "x")})' = −${fr("1", "x²")}</p>
<p>Da ${sq("x")} = x<sup>1/2</sup> und ${fr("1", "x")} = x<sup>−1</sup>, passt das zur Potenzregel: <b>Die Potenzregel gilt für alle reellen Exponenten.</b> (Der Beweis braucht die Kettenregel und ln bzw. eˣ.) Beispiele: (x⁻¹)' = −x⁻², (x⁻³⁴)' = −34x⁻³⁵, (x<sup>1/3</sup>)' = ⅓x<sup>−2/3</sup>.</p>
<p>h-Methode für √x: mit ${sq("x+h")} + ${sq("x")} erweitern → ${fr("h", "h(" + sq("x+h") + " + " + sq("x") + ")")} → ${fr("1", "2" + sq("x"))}. Für 1/x: auf gleichen Nenner bringen → ${fr("−h", "x(x+h)h")} → −${fr("1", "x²")}.</p>
<h3>Produktregel</h3>
<p class="formula">p(x) = f(x)·g(x) &nbsp;⇒&nbsp; p'(x) = f'(x)·g(x) + f(x)·g'(x)</p>
<p><b>Achtung:</b> (f·g)' ≠ f'·g'. Gegenbeispiel: x²·x³ = x⁵ → 5x⁴, aber 2x·3x² = 6x³.</p>
<p><b>Beweis (Nullergänzung):</b> Im Zähler −f(x)g(x+h) + f(x)g(x+h) einfügen (= 0):<br>${fr("p(x+h) − p(x)", "h")} = ${fr("f(x+h) − f(x)", "h")}·g(x+h) + f(x)·${fr("g(x+h) − g(x)", "h")} → f'(x)·g(x) + f(x)·g'(x)<br>(g(x+h) → g(x), weil g differenzierbar und damit stetig ist).</p>
<p>Beispiele: (x·${sq("x")})' = ${sq("x")} + x·${fr("1", "2" + sq("x"))} = ${fr("3", "2")}${sq("x")} &nbsp;·&nbsp; ((1−x³)(2+2x+2x²))' = −3x²(2+2x+2x²) + (1−x³)(2+4x)</p>
<h3>Quotientenregel</h3>
<p class="formula">(${fr("g(x)", "h(x)")})' = ${fr("g'(x)·h(x) − g(x)·h'(x)", "h(x)²")}, h(x) ≠ 0</p>
<p>Merksatz: <b>"Ableitung Zähler mal Nenner minus Zähler mal Ableitung Nenner, durch Nenner im Quadrat"</b> (NAZ − ZAN durch N²). Die Reihenfolge im Zähler ist wichtig wegen dem Minus.</p>
<p><b>Herleitung:</b> f = ${fr("g", "h")} → g = f·h → Produktregel: g' = f'·h + f·h' → f' = ${fr("g' − f·h'", "h")} → f durch ${fr("g", "h")} ersetzen und auf einen Bruchstrich: f' = ${fr("g'·h − g·h'", "h²")}</p>
<p>Beispiel: (${fr("3x", "x−3")})' = ${fr("3(x−3) − 3x·1", "(x−3)²")} = ${fr("−9", "(x−3)²")} &nbsp;·&nbsp; Spezialfall: (${fr("1", "h")})' = ${fr("−h'", "h²")}</p>
<h3>Kettenregel</h3>
<p>Verkettung k(x) = f(g(x)): äussere Funktion f, innere Funktion g. Beispiel (2x+1)³: f(x) = x³, g(x) = 2x+1.</p>
<p class="formula">k'(x) = f'(g(x))·g'(x) &nbsp;&nbsp; "äussere Ableitung mal innere Ableitung"</p>
<p>Beispiele: ((2x+1)³)' = 3(2x+1)²·2 = 6(2x+1)² &nbsp;·&nbsp; (${sq("x+1")})' = ${fr("1", "2" + sq("x+1"))} &nbsp;·&nbsp; (${fr("1", "−3x²−7")})' = −${fr("1", "(−3x²−7)²")}·(−6x) = ${fr("6x", "(−3x²−7)²")}</p>
<p><b>Beweis-Idee:</b> Differenzenquotient mit ${fr("g(x+h) − g(x)", "g(x+h) − g(x)")} = 1 erweitern → ${fr("f(g(x+h)) − f(g(x))", "g(x+h) − g(x)")}·${fr("g(x+h) − g(x)", "h")} → f'(g(x))·g'(x).</p>
`,
d4: `
<div class="how"><b>So lernst du (ca. 40 min)</b><ol><li>Lerne die Tabelle unten auswendig (Karteikarten).</li><li>Rechne die Herleitung von (eˣ)' und (ln x)' einmal nach.</li><li><a href="#" data-go="ueb/d3">Übungsblatt 3</a> und <a href="#" data-go="quiz/C">Quiz C</a>.</li></ol></div>
<h3>Alle Ableitungen auf einen Blick</h3>
<div class="tw"><table><tr><th>f(x)</th><th>f'(x)</th></tr>
<tr><td>sin(x)</td><td>cos(x)</td></tr><tr><td>cos(x)</td><td>−sin(x)</td></tr>
<tr><td>tan(x) = ${fr("sin(x)", "cos(x)")}</td><td>${fr("1", "cos²(x)")} = 1 + tan²(x)</td></tr>
<tr><td>eˣ</td><td>eˣ</td></tr><tr><td>aˣ = e<sup>x·ln(a)</sup></td><td>ln(a)·aˣ</td></tr>
<tr><td>ln(x)</td><td>${fr("1", "x")}</td></tr><tr><td>logₐ(x) = ${fr("ln(x)", "ln(a)")}</td><td>${fr("1", "x·ln(a)")}</td></tr></table></div>
<h3>Herleitungen (Ideen)</h3>
<ul>

<h3>Zufallsvariable und Verteilung</h3>
<p><b>Definition 1:</b> Eine <b>Zufallsvariable</b> (Zufallsgrösse) X ordnet jedem Ergebnis eines Zufallsversuchs eine Zahl zu. Mögliche Werte: x₁, x₂, ..., xₙ.</p>
<p><b>Definition 2:</b> Ordnet man jedem Wert xᵢ die Wahrscheinlichkeit P(X = xᵢ) = pᵢ zu, erhält man die <b>Wahrscheinlichkeitsverteilung</b> von X (als Tabelle oder Säulendiagramm).</p>
<p>Es gilt immer: <b>p₁ + p₂ + ... + pₙ = 1</b>. Werte, die nicht vorkommen, haben P = 0.</p>
<p>Beispiel: Zwei Würfel, keine Eins → −1 Fr., sonst +1 Fr. pro Eins: P(X = 2) = ${fr("1", "36")}, P(X = 1) = ${fr("10", "36")}, P(X = −1) = ${fr("25", "36")}.</p>
<h3>Erwartungswert</h3>
<p class="formula">E(X) = μ = x₁·p₁ + x₂·p₂ + ... + xₙ·pₙ = Σ xᵢ·pᵢ</p>
<p>Gewichtetes Mittel der Werte. Bei Spielen: durchschnittlicher Gewinn pro Spiel <b>auf lange Sicht</b>. Herleitung: Mittelwert = Σ xᵢ·${fr("Hᵢ", "n")}, und die relative Häufigkeit ${fr("Hᵢ", "n")} nähert sich für grosse n der Wahrscheinlichkeit pᵢ. E(X) muss kein möglicher Wert sein (Würfel: 3.5).</p>
<p><b>Definition 4: Faires Spiel</b>, wenn sich Gewinn und Verlust auf lange Sicht ausgleichen: <b>E(Gewinn) = 0</b> (Gewinn = Auszahlung − Einsatz). Fairer Einsatz = E(Auszahlung).</p>
<h3>Varianz und Standardabweichung</h3>
<p>Der Erwartungswert ist ein <b>Lagemass</b>, sagt aber nichts über die Streuung. Die Summe der Abweichungen (xᵢ − μ)·pᵢ ist immer 0, darum quadriert man.</p>
<p class="formula">Var(X) = Σ (xᵢ − μ)²·pᵢ = E((X − μ)²) &nbsp;&nbsp;&nbsp; σ(X) = √Var(X)</p>
<p>Die Varianz hat die quadrierte Einheit (Fr.²), die Standardabweichung wieder die Einheit der Werte (Fr.). Grosse Abweichungen fallen durch das Quadrieren stärker ins Gewicht. σ = Risiko bzw. Schwankung.</p>

  ${ORAL.map((o, i) => `<div class="drawcard"><b>${i + 1}. ${o[0]}</b> <span class="state ${st[i] || ""}">${st[i] === "y" ? "gewusst" : st[i] === "n" ? "nochmals" : ""}</span><br><button class="btn sm ghost" data-r="${i}">Antwort</button><div id="o${i}" hidden><p>${o[1]}</p><button class="btn sm good" data-s="y" data-i="${i}">Gewusst</button> <button class="btn sm bad" data-s="n" data-i="${i}">Nochmals</button></div></div>`).join("")}`;
  app().querySelectorAll("[data-r]").forEach(b => b.onclick = () => { const e = $("#o" + b.dataset.r); e.hidden = !e.hidden; });
  app().querySelectorAll("[data-s]").forEach(b => b.onclick = () => { const s = S.get("oral", {}); s[b.dataset.i] = b.dataset.s; S.set("oral", s); viewOral(); });
}

// ---------- Simulation ----------
function viewSim() { const hist = S.get("simhist", []);
  app().innerHTML = `<h1>Prüfungssimulation (15 min)</h1><p class="lead">Wie die echte Prüfung: zuerst ein zufälliges Präsentationsthema (5 min), dann je eine Aufgabe Differentialrechnung und Stochastik (10 min). Laut sprechen, am besten vor jemandem oder mit Aufnahme. Am Schluss bewertest du dich mit Checklisten, die Seite rechnet die Note nach der Skala deiner Lehrperson.</p>
  <p><button class="btn" id="go">Simulation starten</button></p>
  ${hist.length ? `<h2>Bisherige Simulationen</h2><div class="tw"><table><tr><th>Datum</th><th>Punkte</th><th>Note</th></tr>${hist.map(h => `<tr><td>${h.d}</td><td>${h.p} / 12</td><td>${h.n}</td></tr>`).join("")}</table></div>` : ""}`;
  $("#go").onclick = runSim; }
function runSim() {
  const pi = Math.floor(Math.random() * PRES.length), p = PRES[pi], d = pick(SIMD), s = pick(SIMS), q1 = pick(p.qs), oq = shuffle(ORAL).slice(0, 2);
  app().innerHTML = `<h1>Teil 1 · Präsentation</h1><div class="timer big" id="tm">05:00</div><p class="lead">Thema: <b>${p.t}</b>. 4 min vortragen, dann beantworte die Frage unten (1 min). Keine Stichworte!</p>
  <p class="small">Zusatzfrage (erst nach dem Vortrag lesen): <span class="hide" id="h1">${q1[0]}</span> <button class="btn sm ghost" id="sh1">zeigen</button></p>
  <p><button class="btn" id="t2">Weiter zu Teil 2</button></p>`;
  timer("#tm", 300); $("#sh1").onclick = () => $("#h1").classList.remove("hide");
  $("#t2").onclick = () => { clearTimers();
    app().innerHTML = `<h1>Teil 2 · Aufgaben</h1><div class="timer big" id="tm">10:00</div><p class="lead">Löse auf Papier und kommentiere jeden Schritt laut.</p>
    <div class="simq"><b>Differentialrechnung:</b> ${d.q}</div><div class="simq"><b>Stochastik:</b> ${s.q}</div>
    <div class="simq"><b>Prüferfragen dazwischen:</b><br>1. ${oq[0][0]}<br>2. ${oq[1][0]}</div>
    <p><button class="btn" id="ev">Fertig, auswerten</button></p>`;
    timer("#tm", 600);
    $("#ev").onclick = () => { clearTimers();
      const blk = (title, items, sol) => `<div class="simq"><b>${title}</b>${sol ? `<div class="sol">${sol}</div>` : ""}${items.map(c => `<label class="task"><input type="checkbox" class="sc"> <span>${c}</span></label>`).join("")}</div>`;
      app().innerHTML = `<h1>Auswertung</h1><p class="lead">Hake ehrlich ab, was du gesagt und richtig gemacht hast.</p>
      <h2>Teil 1: ${p.t} (4 Punkte)</h2><div id="p1">${blk("Inhalt", p.checks)}${blk("Zusatzfrage: " + q1[0], ["Frage richtig beantwortet"], q1[1])}</div>
      <h2>Teil 2 (8 Punkte)</h2><div id="p2">${blk("Differentialrechnung: " + d.q, d.c.concat(["Schritte laut kommentiert"]), d.sol)}${blk("Stochastik: " + s.q, s.c.concat(["Schritte laut kommentiert"]), s.sol)}${blk("Prüferfragen", [oq[0][0] + " → " + oq[0][1], oq[1][0] + " → " + oq[1][1]])}</div>
      <p><button class="btn" id="calc">Note berechnen</button></p><div id="res"></div>`;
      $("#calc").onclick = () => { const r = sel => { const all = app().querySelectorAll(sel + " .sc"); const c = [...all].filter(x => x.checked).length; return c / all.length; };
        const pts = Math.round((r("#p1") * 4 + r("#p2") * 8) * 2) / 2; const n = noteFromPts(pts);
        const h = S.get("simhist", []); const dt = new Date(); h.unshift({ d: `${dt.getDate()}.${dt.getMonth() + 1}. ${dt.getHours()}:${String(dt.getMinutes()).padStart(2, "0")}`, p: pts, n }); S.set("simhist", h.slice(0, 10));
        $("#res").innerHTML = `<div class="fb ${n >= 5.5 ? "y" : "n"}"><b>${pts} von 12 Punkten → Note ${n}.</b> ${n >= 6 ? "Du bist ready." : "Schau, wo Häkchen fehlen: Karteikarten und Übungsblätter dazu, dann nochmals simulieren."}</div>`; };
    };
  };
}

route();

</script>
</body>
