e: `
<div class="how"><b>So lernst du dieses Kapitel (ca. 30 min)</b>
<ol><li>Lies das Kapitel einmal ganz durch.</li>
<li>Schliess die Seite und schreib die Tabelle "Die 5 Wege" aus dem Kopf auf ein Blatt: Weg, Art, Reaktion, Dauer, ATP.</li>
<li>Vergleiche mit der Tabelle und korrigiere mit Rot.</li>
<li>Mach Quiz A. Unter 80 %: Fehler nachlesen und Quiz A nochmals.</li></ol></div>

<h3>ATP und Resynthese</h3>
<p>ATP (Adenosintriphosphat) ist die Energiewährung des Körpers. Jede Muskelkontraktion braucht ATP.</p>
<p class="formula">ATP ⇌ ADP + P + Energie</p>
<p>Der Muskel speichert nur wenig ATP (ca. 6 mmol/kg). Das reicht bei maximaler Belastung für 2-3 Sekunden, also 3-4 Kontraktionen. Darum muss ATP laufend neu gebildet werden (Resynthese). Die Energie dafür kommt aus Kohlenhydraten, Fetten und sehr wenig aus Proteinen.</p>
<p><b>Begriffe:</b> anaerob = ohne Sauerstoff, aerob = mit Sauerstoff, alaktazid = ohne Laktatbildung, laktazid = mit Laktatbildung.</p>

<h3>Die 5 Wege</h3>
<div class="tw"><table>
<tr><th>Weg</th><th>Art</th><th>Reaktion</th><th>Dauer</th><th>Merkmale</th></tr>
<tr><td>ATP-Speicher</td><td>anaerob alaktazid</td><td>ATP → ADP + P + Energie</td><td>2-3 s</td><td>sofort da, sehr klein</td></tr>
<tr><td>Kreatinphosphat (KrP)</td><td>anaerob alaktazid</td><td>KrP + ADP ⇌ Kreatin + ATP (Kreatinkinase)</td><td>bis ca. 10 s</td><td>Speicher ca. 20 mmol/kg, nach 5-8 min wieder voll; Training und Kreatin vergrössern ihn</td></tr>
<tr><td>Anaerobe Glykolyse</td><td>anaerob laktazid</td><td>Glykogen → Laktat + Energie</td><td>ca. 45-90 s</td><td>1 Glukose = <b>2 ATP</b>, schnell aber wenig ergiebig</td></tr>
<tr><td>Aerobe Glykolyse</td><td>aerob</td><td>Glukose + O₂</td><td>bis ca. 90 min</td><td>1 Glukose = <b>30-32 ATP</b>; braucht ca. 2 min, bis Atmung und Kreislauf angepasst sind</td></tr>
<tr><td>Fettsäureoxidation</td><td>aerob</td><td>Fettsäuren + O₂</td><td>Stunden bis Tage</td><td>grösster Speicher, aber langsamste ATP-Bildung</td></tr>
</table></div>
<p>Proteine liefern nur einen sehr kleinen Anteil, vor allem bei extrem langen Belastungen. Glykogen ist die Speicherform von Glukose in Muskel und Leber.</p>

<h3>Intensität und Dauer</h3>
<p>Je höher die Intensität, desto schneller muss ATP gebildet werden (ATP-Bildungsrate). Das schaffen nur KrP und anaerobe Glykolyse. Je länger die Belastung, desto grösser der aerobe Anteil, zuerst Glukose, dann Fett. Die Systeme laufen nie allein, sie überlappen sich.</p>
<p><b>Reihenfolge merken:</b> KrP → anaerobe Glykolyse → aerober Glukoseabbau → Fettoxidation. Nach rechts sinkt die Intensität und die mögliche Dauer steigt.</p>
<p>Übersicht: anaerob alaktazid (ATP, KrP) bis ca. 10 s · anaerob laktazid (anaerobe Glykolyse) bis ca. 90 s · aerobe Glykolyse bis ca. 90 min · Fettverbrennung mehrere Stunden.</p>

<h3>Laktat und metabolische Azidose</h3>
<ul>
<li><b>Entstehung:</b> In einem Schritt der Glykolyse wird ein H⁺-Ion abgegeben. Ohne genug Sauerstoff geht das nicht regulär, also wird H⁺ auf Pyruvat übertragen. So entsteht Laktat.</li>
<li><b>Kein Abfallprodukt:</b> Herz, Leber und unbelastete Muskulatur bauen Laktat ab und wandeln es in Glukose oder Energie um. Es ist auch ein Signalmolekül.</li>
<li><b>Nutzen:</b> Laktat zeigt die Ausdauerleistungsfähigkeit (anaerobe Schwelle im Laktatstufentest).</li>
<li><b>H⁺-Ionen</b> entstehen bei jeder ATP-Hydrolyse. Unter anaeroben Bedingungen werden sie weniger abgebaut und sammeln sich an.</li>
<li><b>Metabolische Azidose:</b> H⁺ häuft sich an, der pH sinkt (Übersäuerung), die Muskelkontraktion wird gehemmt → Leistungsabbruch.</li>
</ul>

<h3>Verknüpfung mit Sportarten</h3>
<div class="tw"><table>
<tr><th>Strecke</th><th>ATP/KrP %</th><th>anaerob laktazid %</th><th>aerob %</th></tr>
<tr><td>100 m</td><td>25</td><td>70</td><td>unter 5</td></tr>
<tr><td>200 m</td><td>15</td><td>60</td><td>25</td></tr>
<tr><td>400 m</td><td>12</td><td>43</td><td>45</td></tr>
<tr><td>800 m</td><td>10</td><td>30</td><td>60</td></tr>
<tr><td>1500 m</td><td>8</td><td>20</td><td>72</td></tr>
<tr><td>5000 m</td><td>4</td><td>10</td><td>86</td></tr>
<tr><td>Marathon</td><td>0</td><td>5-2</td><td>95-98</td></tr>
</table></div>
<p>Achtung: Laut Tabelle ist schon beim 100-m-Lauf der grösste Anteil anaerob laktazid (70 %). KrP dominiert bei ganz kurzen Belastungen unter ca. 10 s mit einzelnen Aktionen: Start, Sprung, Wurf, Kugelstossen, Gewichtheben.</p>
<p>Bei den Lauf-Weltrekorden sinkt die Geschwindigkeit mit der Distanz. Die Knicke zeigen den Wechsel von KrP (bis ca. 200 m) zur anaeroben Glykolyse (bis ca. 800 m) zur aeroben Glykolyse.</p>
<p><b>Begründen:</b> 400 m und 200 m Crawl = viel anaerobe Glykolyse (45-90 s, sehr intensiv). Marathon, Langlauf = aerob. Fussball = Mischform: aerobe Grundlage für 90 min plus KrP und anaerobe Glykolyse für Sprints und Zweikämpfe.</p>
`,

l: `
<div class="how"><b>So lernst du dieses Kapitel (ca. 45 min)</b>
<ol><li>Lies Schwellenkonzept und Laktatstufentest.</li>
<li>Schreib die Laktatwerte (Ruhe, AS, ANS, Ausbelastung) und je 4 Ausbelastungs- und Abbruchkriterien aus dem Kopf auf.</li>
<li>Geh in den <a href="#" data-go="dmax">Dmax-Trainer</a> und mach Proband 1 und Probandin 2 selbst, zuerst auf Papier mit Lineal.</li>
<li>Mach Quiz A.</li></ol></div>

<h3>Leistungsphysiologie</h3>
<p>Teil der Sportphysiologie: Wie wirken Herz-Kreislauf, Atmung, Muskulatur und Stoffwechsel bei Belastung zusammen und wie passen sie sich durch Training an? Ziel: diese Prozesse messbar machen (Leistungsdiagnostik) und daraus Trainingsempfehlungen ableiten.</p>
<p><b>Parameter</b> sind messbare Kenngrössen, z.B. Herzfrequenz, Schlagvolumen, VO₂max, Laktat.</p>
<div class="tw"><table>
<tr><th>Parameter</th><th>Bedeutung</th></tr>
<tr><td>Aerobe Leistungsfähigkeit (aerobic power)</td><td>maximale Intensität ohne Laktatakkumulation</td></tr>
<tr><td>Aerobe Kapazität (Ermüdungsresistenz)</td><td>eine Leistung im Bereich der anaeroben Schwelle lange halten</td></tr>
<tr><td>Anaerobe Leistungsfähigkeit</td><td>maximale Intensität mit extremer anaerober Energiebereitstellung, ohne Rücksicht auf Laktat und Sauerstoffdefizit</td></tr>
<tr><td>Anaerobe Kapazität (Laktattoleranz, Stehvermögen)</td><td>die Folgen der anaeroben Energiebereitstellung länger ertragen</td></tr>
<tr><td>VO₂max</td><td>maximale Sauerstoffaufnahme pro Minute</td></tr>
</table></div>

<h3>Schwellenkonzept und Laktatwerte</h3>
<div class="tw"><table>
<tr><th>Punkt</th><th>Laktat</th><th>Bedeutung</th></tr>
<tr><td>Ruhelaktat</td><td>0.7-1.8 mmol/l</td><td>in Ruhe</td></tr>
<tr><td>Aerobe Schwelle (AS)</td><td>ca. 2 mmol/l</td><td>höchste Belastung, bei der Laktat noch fast dem Ruhewert entspricht; erster Anstieg (0.3-0.4 mmol/l zwischen zwei Messungen); bis hier v.a. aerob</td></tr>
<tr><td>Laktat Steady State</td><td>ca. 2-4 mmol/l</td><td>Laktat wird laufend abgebaut, Gleichgewicht</td></tr>
<tr><td>Anaerobe Schwelle (ANS) = maxLSS</td><td>ca. 4 mmol/l (individuell 2.3-6.8)</td><td>höchste Belastung mit Gleichgewicht von Laktatbildung und Laktatabbau; danach exponentieller Anstieg</td></tr>
<tr><td>Ausbelastung</td><td>über 8 mmol/l</td><td>Kriterium im Test</td></tr>
<tr><td>Abbruch bei Trainierten</td><td>bis über 20 mmol/l</td><td>je nach Trainingszustand</td></tr>
</table></div>
<p>Bei leichter Aktivität (auslaufen) wird Laktat deutlich schneller abgebaut als in Ruhe.</p>
<p><b>Schwellen erkennen:</b> AS = dort, wo die flache Kurve zum ersten Mal ansteigt. ANS = dort, wo die Kurve steil (exponentiell) wird. Senkrecht nach unten liest du die Leistung ab, auf der HF-Kurve die Herzfrequenz.</p>

<h3>Einfluss von Training</h3>
<p>Ausdauertraining verschiebt die Laktatkurve nach <b>rechts</b>: Bei gleicher Leistung weniger Laktat und tiefere HF.</p>
<ul>
<li><b>Lockeres Training (Zone 1, GA1):</b> Schlagvolumen ↑, Ruhe-HF ↓, mehr Kapillaren und Mitochondrien, besserer Fettstoffwechsel → aerobe Schwelle nach oben.</li>
<li><b>Training an der ANS (Zone 2, GA2):</b> mehr Säuretoleranz und Pufferkapazität → anaerobe Schwelle nach oben.</li>
<li><b>Training über der ANS (Zone 3):</b> VO₂max ↑, maximales Herzminutenvolumen, bessere anaerobe Kapazität und Säuretoleranz.</li>
</ul>

<h3>Ausdauerdiagnostik (Pyramide)</h3>
<p>Von genau und teuer zu einfach und billig: VO₂-Messung (Spiroergometrie) → Laktatmessung (Stufentest) → Herzfrequenzmessung (Conconi-Test) → Zeit- oder Distanzmessung (12-min-Lauf).</p>

<h3>Laktatstufentest</h3>
<div class="tw"><table>
<tr><td><b>Ziel</b></td><td>anaerobe Schwelle über Blutlaktat bestimmen; aerobe Ausdauerleistungsfähigkeit bestimmen</td></tr>
<tr><td><b>Nutzen</b></td><td>Trainingsbereiche aus Laktat und Herzfrequenz ableiten</td></tr>
<tr><td><b>Aufbau</b></td><td>Maximaltest: alle 3 min +30 W (Velo) oder +1.2 km/h (Laufband) bis zur Ausbelastung</td></tr>
<tr><td><b>Vorgehen</b></td><td>Blutlaktat am Ohrläppchen oder Finger, vor, während und nach der Belastung</td></tr>
<tr><td><b>Messgrössen</b></td><td>Leistung (W oder km/h), Laktat (mmol/l), Herzfrequenz, Borg (6-20)</td></tr>
</table></div>
<p><b>Ablauf Velo:</b> in Ruhe Laktat, HF, Borg messen → 5 min locker einfahren → messen → am Ende jeder Stufe (ca. 15 s vor Stufenende) Laktat, HF, Borg → Abbruch bei maximaler Erschöpfung (aufhören zu treten oder Kadenz unter 70), sofort messen → nach 3 min Erholung nochmals messen.</p>
<p>Stufendauer 3 min, keine Pause, +30 W, Kadenz sinnvoll 80-100 U/min. Testperson: bereit für All-out, 48 h vorher keine maximale Belastung, gewohnte Ernährung, PAR-Q-Fragebogen, Zustimmung zu Blut- und HF-Messung.</p>

<h3>Ausbelastungs- und Abbruchkriterien</h3>
<p>Ausbelastungskriterien zeigen, dass der Test wirklich maximal war (gültig). Abbruchkriterien sind Gründe, aus Sicherheitsgründen zu stoppen.</p>
<div class="tw"><table>
<tr><th>Ausbelastungskriterien</th><th>Abbruchkriterien</th></tr>
<tr><td>maximale HF erreicht (bekannt oder berechnet)</td><td>subjektive Erschöpfung</td></tr>
<tr><td>Borg ≥ 18</td><td>Angina pectoris (Engegefühl in der Brust)</td></tr>
<tr><td>Laktat über 8 mmol/l</td><td>zunehmende Atemnot</td></tr>
<tr><td>Eindruck der Testleitung</td><td>Schwindel, motorische Unsicherheit, Unwohlsein, Übelkeit</td></tr>
</table></div>

<h3>Modifizierte Dmax-Methode</h3>
<ol>
<li>Laktat (y) gegen Leistung (x) eintragen und zur Kurve verbinden.</li>
<li><b>Aerobe Schwelle:</b> der Messpunkt <b>vor</b> dem ersten Laktatanstieg von mehr als 0.4 mmol/l.</li>
<li>Gerade von der AS zum letzten Messpunkt ziehen.</li>

<div class="tw"><table>
<tr><th>Faktor</th><th>Inhalt</th><th>Beispiel Fussball</th></tr>

<tr><td>Anlagen und Gesundheit</td><td>Genetik, Körperbau</td><td>Muskelfaserverteilung</td></tr>
</table></div>

<h3>Prinzip der Trainingsbelastung</h3>
<p>Training wirkt nur bei einem genügend starken Reiz. Zu schwach = keine Wirkung, zu stark = Schaden. Belastungsnormative:</p>
<ul><li><b>Intensität:</b> wie stark (Tempo, % Maximalkraft, HF)</li><li><b>Dauer:</b> wie lange ein einzelner Reiz wirkt</li><li><b>Umfang:</b> Gesamtmenge (km, Wiederholungen)</li><li><b>Dichte:</b> Verhältnis Belastung zu Pause</li><li><b>Häufigkeit:</b> Trainings pro Woche</li></ul>
<p>Beispiel: 6 × 400 m in 90 s, 2 min Pause, 2-mal pro Woche → Intensität 90 s pro 400 m, Dauer 90 s, Umfang 2400 m, Dichte 90 s zu 2 min, Häufigkeit 2 pro Woche. Aus den Ausdauer-Folien: zentrale Faktoren der Planung sind Intensität, Volumen und Erholung.</p>

<h3>Adaptationen</h3>
<p>Der Körper passt sich an wiederholte Belastung an (Superkompensation): grösseres Herz und Schlagvolumen, mehr Mitochondrien und Kapillaren, grösserer Muskelquerschnitt, bessere Koordination, grössere Energiespeicher. Ohne Training bilden sich die Anpassungen zurück.</p>

<h3>Wechselwirkungen</h3>

<li>Reihenfolge in einer Einheit: Koordination und Schnelligkeit zuerst, dann Kraft, Ausdauer am Schluss ("Koordination vor Kondition").</li></ul>

<li><b>Belastung und Erholung:</b> neuer Reiz im Moment der Superkompensation.</li>
<li><b>Regelmässigkeit:</b> Unterbrüche führen zu Rückbildung.</li>
<li><b>Variation:</b> Abwechslung verhindert Stagnation.</li>
<li><b>Individualität:</b> an Alter, Niveau, Ziel anpassen.</li>
<li><b>Spezifität:</b> trainieren, was die Sportart verlangt.</li>

<h3>Definition</h3>
<p>Ausdauer ist die psycho-physische Ermüdungsresistenz bei mentaler, sensorischer, sensomotorischer, emotionaler und physischer Belastung. Sie ist die Fähigkeit, eine bestimmte Leistung bis ins Ziel aufrechtzuerhalten und eine Belastung ohne nennenswerte Ermüdung möglichst lange zu ertragen.</p>

<tr><td>physisch</td><td>Marathon, Langlauf</td></tr>
</table></div>
<p>Was es braucht: Genetik, VO₂max, Muskelfasertypen, Rekrutierung (Nerven), Koordination, Muskelkraft, Gewicht, Körpergrösse, Mentales und vor allem Training (10'000-Stunden-Regel).</p>

<h3>5 Intensitätsstufen</h3>
<div class="tw"><table>
<tr><th>Stufe</th><th>Name</th><th>Borg</th><th>Sprechregel</th><th>% HFmax</th><th>Energie</th><th>Wirkung</th></tr>

<tr><td>3</td><td>mittel</td><td>13-14</td><td>ganze Sätze</td><td>80-90</td><td>aerob-anaerober Übergang</td><td>aerobe Leistungsfähigkeit</td></tr>
<tr><td>4</td><td>hart, an der Schwelle</td><td>15-16</td><td>knapper Wortwechsel</td><td>90-95</td><td>aerob-anaerober Übergang</td><td>aerobe Leistungsfähigkeit</td></tr>

<p>Methoden: Stufe 1 kontinuierliche Dauermethode · Stufe 2-3 Dauermethode (kontinuierlich, variabel), extensive Intervalle · Stufe 4-5 intensive Intervalle, intermittierend, Wiederholung, Wettkampf. % vANS: 55-70, 70-80, 80-93, 93-103, über 103.</p>

<h3>3 Trainingsbereiche</h3>
<div class="tw"><table>
<tr><th>Zone</th><th>Lage</th><th>Laktat</th><th>Effekt</th></tr>
<tr><td>Zone 1, GA1</td><td>unter der AS</td><td>Basiswerte</td><td>Schlagvolumen ↑, Ruhe-HF ↓, Kapillaren und Mitochondrien ↑, oxidative Enzyme ↑, Fettstoffwechsel ↑, AS nach oben</td></tr>
<tr><td>Zone 2, GA2</td><td>zwischen AS und ANS</td><td>erhöht, konstant</td><td>Herz-Kreislauf wie Zone 1, Säuretoleranz und Pufferkapazität ↑, ANS nach oben</td></tr>
<tr><td>Zone 3, wettkampfspezifisch</td><td>über der ANS</td><td>unkonstant, steigt</td><td>VO₂max ↑, max. Herzminutenvolumen, anaerobe Kapazität und Säuretoleranz ↑</td></tr>

<p>Ungefähr: Zone 1 = Stufe 1-2, Zone 2 = Stufe 3, Zone 3 = Stufe 4-5.</p>

<h3>Superkompensation</h3>
<p>Mehr und intensiver ist nicht automatisch besser. Ablauf: Training → Leistung sinkt unter Ausgangsniveau (Ermüdung) → Erholung bis zum Ausgangsniveau → Superkompensation über das Ausgangsniveau → ohne neuen Reiz wieder zurück.</p>
<ul><li><b>Optimal:</b> neuer Reiz im Hoch der Superkompensation → Leistung steigt treppenartig.</li>
<li><b>Zu früh:</b> noch ermüdet → Leistung nimmt langfristig ab (Übertraining).</li>
<li><b>Zu spät:</b> Leistung bleibt gleich.</li></ul>

<h3>Trainingsmethoden</h3>
<div class="tw"><table>
<tr><th>Methode</th><th>Belastung</th><th>Intensität</th><th>Pause</th><th>Beispiel</th></tr>
<tr><td>Dauermethode</td><td>ununterbrochen, 20 min bis Stunden, HF konstant</td><td>locker &lt;70 %, extensiv 70-80 %, intensiv 80-90 %</td><td>keine</td><td>GA1: 30-60 min plaudern; GA2: 30-60 min kurze Sätze</td></tr>
<tr><td>Intervallmethode</td><td>Wechsel Belastung/Erholung, 6-12 Wdh; Kurzzeit 15-60 s, Mittelzeit 1-8 min, Langzeit 8-15 min</td><td>extensiv 60-80 %, intensiv &gt;90 %</td><td>lohnende Pause, 15 s bis 10 min</td><td>8 × 3 min, 1 min Pause; 8 × 1 min, 2 min Pause</td></tr>
<tr><td>Wiederholungsmethode</td><td>wenige Wdh, kleiner Umfang</td><td>90-100 % VO₂max</td><td>vollständig, 4-30 min</td><td>8 × 1 min, 10 min Pause</td></tr>
<tr><td>Intermittierende Methode</td><td>kurze hochintensive Belastungen im ständigen Wechsel mit kurzer aktiver Erholung</td><td>hoch (z.B. 95 % / 70 %)</td><td>kurz, aktiv</td><td>15 s schnell / 15 s locker, 6 min</td></tr>
<tr><td>Kontroll- und Wettkampfmethode</td><td>Wettkampfdauer, kürzer oder länger</td><td>95-105 % Wettkampfleistung</td><td>keine</td><td>10-70 min im Wettkampftempo</td></tr>
</table></div>
<p><b>Lohnende Pause</b> = man startet wieder, bevor man vollständig erholt ist. Je höher die Intensität, desto kleiner der Umfang.</p>

<h3>Polarisiertes Trainingsmodell (80/20)</h3>
<p>Ca. 80 % der Einheiten in Zone I (locker), ca. 20 % in Zone III (intensiv, ca. 2 pro Woche), möglichst wenig in Zone II. Man trainiert an den Polen (Seiler). Zuerst die intensiven Einheiten planen, dann mit lockeren auffüllen.</p>
<p><b>Beispiel Silvesterlauf:</b> 2-4 Trainings pro Woche, mindestens 1 × Zone 1-2 (Dauerlauf 30-60 min), mindestens 1 × Zone 3-5 (Intervalle, total 8-18 min Belastung; vor dem Lauf Wettkampfmethode).</p>
<p><b>Rezept:</b> möglichst viel die Zieldisziplin trainieren, 2-3 Einheiten pro Woche Zone 3-5, Rest Zone 1-2, periodisch variieren. "Fancy stuff" (Periodisierung usw.) erst, wenn das Grundlegende stimmt.</p>

<h3>Trainingsplanung</h3>
<p>1. Ziel definieren · 2. Grobplanung (Wochen, Häufigkeit, Methoden) · 3. Feinplanung (diese Woche) · 4. Trainingsplanung (heute). Steigern: zuerst Häufigkeit, dann Umfang, dann Intensität. Umfang max. +10 % pro Woche.</p>

<h3>Sportartspezifisch und Alternativtraining</h3>
<p>Anpassungen sind spezifisch: Muskeln, Bewegungsmuster und Energiesystem passen sich an genau die trainierte Bewegung an. Darum möglichst viel die Zieldisziplin trainieren. Die Grundlagenausdauer lässt sich gut alternativ trainieren (Velo, Schwimmen): sinnvoll bei Verletzung, zur Entlastung von Gelenken, zur Regeneration und für Abwechslung.</p>

<h3>Pace</h3>
<p>Pace (min/km) = Zeit ÷ Distanz. Geschwindigkeit (km/h) = 60 ÷ Pace. Beispiel: 45 min für 8.5 km = 5.294 min/km = 5:18 min/km (0.294 × 60 = 18 s) = 11.3 km/h.</p>

<p>Koordination ist das Zusammenwirken von zentralem Nervensystem (Gehirn, Rückenmark), Sinnesorganen und Skelettmuskulatur innerhalb eines Bewegungsablaufs. Koordinative Fähigkeiten ermöglichen, Bewegungsaufgaben situationsgerecht und ökonomisch zu lösen, verbessern die Technik und erleichtern das Lernen.</p>

{q:"Wie lange dauert eine einfache Reaktion auf einen akustischen Reiz ungefähr?", a:["0.12 s","0.10 s","0.15 s","0.30 s"], e:"Taktil 0.10, akustisch 0.12, optisch 0.15, komplex 0.20-0.40 s."},
{q:"Welche Schritte hat eine komplexe Reaktion?", a:["Wahrnehmung, Antizipation, Entscheidung","Start, Beschleunigung, Topspeed","Grob-, Fein-, Feinstkoordination","Aufwärmen, Hauptteil, Ausklang"], e:"Entscheidung immer unter Zeitdruck."},
{q:"Was ist Frequenzschnelligkeit?", a:["Gleiche, sich wiederholende Bewegungen mit höchster Geschwindigkeit (zyklisch)","Eine einmalige Bewegung mit höchster Geschwindigkeit","Schnelles Reagieren auf einen Reiz","Geschwindigkeit lange halten"], e:"z.B. Laufen, Radfahren."},
{q:"Badminton-Smash. Welche Schnelligkeit?", a:["Sequenzschnelligkeit (azyklisch)","Frequenzschnelligkeit (zyklisch)","Schnelligkeitsausdauer","einfache Reaktion"], e:"Einmalige Bewegung."},
{q:"Mit welcher Methode trainiert man Schnelligkeit?", a:["Wiederholungsmethode: maximale Intensität, vollständige Erholung","Dauermethode","extensive Intervallmethode","Kraftausdauer-Circuit"], e:"2-3 Serien à 3-6 Wdh."},
{q:"Was zählt in der Beschleunigungsphase des 100-m-Sprints?", a:["Schnell- und Maximalkraft","einfache Reaktion","Schnelligkeitsausdauer","Beweglichkeit"], e:"Bewegungsschnelligkeit."}
],

{q:"Was zählt im Schlussspurt des 100-m-Sprints?", a:["Schnelligkeitsausdauer","einfache Reaktion","Schnellkraft","Agilität"], e:"Geschwindigkeit halten, Stehvermögen."},
{q:"Wann trainiert man Schnelligkeit in einer Einheit?", a:["immer zu Beginn, nach dem Aufwärmen","am Ende, wenn man müde ist","nach dem Ausdauertraining","mitten im Krafttraining"], e:"Nur im ausgeruhten Zustand."},
{q:"Wie viele Serien und Wiederholungen beim Schnelligkeitstraining?", a:["2-3 Serien à 3-6 Wiederholungen","5 Serien à 20 Wiederholungen","1 Serie à 50 Wiederholungen","10 Serien à 10 Wiederholungen"], e:"Wenige, maximale Wiederholungen."},
{q:"Welche Muskelfasern haben Sprinter vor allem?", a:["viele FT-Fasern (schnell)","viele ST-Fasern (langsam)","nur Typ 2a","gleich viele wie Marathonläufer"], e:"Genetik ist ein schnelligkeitsbeeinflussender Faktor."}
],
C: [
{q:"Was zählt in der Topspeed-Phase?", a:["zyklische Frequenzschnelligkeit","Sequenzschnelligkeit","einfache Reaktion","Kraftausdauer"], e:"Maximalgeschwindigkeit."},

{q:"Was bedeutet Antizipation?", a:["Handlungsziele vorwegnehmen ('wenn-dann')","Nur das Wichtige wahrnehmen","Schnell entscheiden","Vollständig erholen"], e:"Zweiter Schritt der komplexen Reaktion."},
{q:"Was beeinflusst den motorischen Anteil der Agilität?", a:["Geschwindigkeit vor dem Wechsel, Abbremskraft, Abdruckkraft, Körperorientierung","Reaktionszeit auf den Startschuss","VO₂max und Laktat","Beweglichkeit der Schulter"], e:"4 Faktoren laut Steinhöfer."},
{q:"Welche Energie nutzt man bei Schnelligkeitsleistungen?", a:["ATP und Kreatinphosphat","Fette","aerobe Glykolyse","Proteine"], e:"Sehr kurze, maximale Belastung."},
{q:"Bei ca. wie vielen Metern erreichen Spitzensprinter die Maximalgeschwindigkeit?", a:["ca. 60 m","ca. 10 m","ca. 30 m","ca. 95 m"], e:"Schüler und weniger Trainierte früher (ca. 40 m)."},
{q:"Welche Aussage zur Definition von Schnelligkeit stimmt?", a:["Die Belastung ist so kurz, dass Ermüdung die Leistung nicht limitiert","Schnelligkeit ist rein konditionell","Schnelligkeit ist die Fähigkeit, lange schnell zu sein","Schnelligkeit hängt nur von Genetik ab"], e:"Koordinativ-konditionell bestimmt."}
]},

b: {

{q:"Wovon hängt die Gelenkigkeit ab?", a:["von der Gelenkstruktur","von der Dehnfähigkeit der Muskeln","von der Herzfrequenz","vom Muskelquerschnitt"], e:"Dehnfähigkeit hängt von Muskeln, Sehnen, Bändern, Kapsel, Haut ab."},
{q:"Bis zu welchem Alter ist die Beweglichkeit am grössten?", a:["bis ca. 10 Jahre","bis ca. 20 Jahre","bis ca. 30 Jahre","bis ca. 5 Jahre"], e:"Danach nimmt sie ohne Training ab."},
{q:"Was ist CR-Stretching?", a:["Zielmuskel zuerst anspannen, dann dehnen","Antagonist anspannen während der Dehnung","Federnd dehnen","Lange passiv halten"], e:"Contract-Relax, eine PNF-Methode."},
{q:"Was erhöht regelmässiges Dehnen vor allem?", a:["die Dehntoleranz","die Muskellänge","den Muskelquerschnitt","die VO₂max"], e:"Subjektive Anpassung des Nervensystems."},
{q:"Was ist Hypermobilität?", a:["Übermässige Beweglichkeit, die muskulär nicht mehr gesteuert werden kann","Eingeschränkte Beweglichkeit durch Knochen","Normale Beweglichkeit","Beweglichkeit nur in der Hüfte"], e:"Hypomobilität = eingeschränkt."},
{q:"Welche Dehnform passt vor einem Sprint?", a:["dynamisches Dehnen","langes statisches Dehnen","gar kein Aufwärmen","intensives CR-Stretching"], e:"Statisches Dehnen senkt kurzfristig die Schnellkraft."},
{q:"Verhindert Dehnen Verletzungen?", a:["Es wurde keine verletzungsprophylaktische Wirkung nachgewiesen","Ja, immer","Ja, aber nur bei Kindern","Ja, wenn man 10 min dehnt"], e:"Klee & Wiemann (2004)."}
],
B: [

{q:"Was ist statisches Dehnen?", a:["Eine Dehnstellung über eine gewisse Zeit halten","Leicht federnd dehnen","Muskel anspannen und loslassen","Mit Schwung dehnen"], e:"Dynamisch = federnd."},
{q:"Was ist AC-Stretching?", a:["Der Antagonist wird während der Dehnung angespannt","Der Zielmuskel wird vor der Dehnung angespannt","Ein Partner drückt","Federndes Dehnen"], e:"Aktives Dehnen, PNF."},
{q:"Verhindert Dehnen Muskelkater?", a:["Nein, es kann ihn sogar hervorrufen","Ja, immer","Nur statisches Dehnen","Nur am Morgen"], e:"Dehnen kann kleine Muskelverletzungen verursachen."},
{q:"Was ist Hypomobilität?", a:["Eingeschränkte Beweglichkeit durch knöcherne Einschränkungen oder Fehlbelastungen","Übermässige Beweglichkeit","Beweglichkeit nur bei Kindern","Muskelkrampf"], e:"Hypermobilität = übermässig."},
{q:"Dehntest Beinrückseite: Beugung unter 80°. Was bedeutet das?", a:["Verkürzung","keine Verkürzung","leichte Verkürzung","Hypermobilität"], e:"Bis 90° keine, 80-90° leicht, unter 80° Verkürzung."},
{q:"Wer ist im Durchschnitt beweglicher?", a:["Frauen","Männer","gleich","nur Kinder unter 3"], e:"Biologischer Aspekt."}
],
C: [

{q:"Was bewirkt intensives Dehnen direkt vor dem Wettkampf?", a:["Schnell- und Maximalkraft sinken kurzfristig","Die Kraft steigt kurzfristig","Keine Wirkung","Die Ausdauer steigt"], e:"Belastet die Struktur des Muskels."},
{q:"Was ist spezielle Beweglichkeit?", a:["Beweglichkeit bestimmter Gelenke, sportartspezifisch","Beweglichkeit der wichtigsten Gelenksysteme","Beweglichkeit nur bei Profis","Beweglichkeit durch Partnerhilfe"], e:"Allgemein = Hüfte, Wirbelsäule, Knie."},
{q:"Welcher Faktor schränkt die Beweglichkeit ein?", a:["Muskeltonus","Herzfrequenz","Laktatwert","Reaktionszeit"], e:"Weitere: Gelenkstruktur, Muskelmasse, Dehnfähigkeit von Muskel, Sehnen, Bändern, Kapsel, Haut."},
{q:"Wie wirkt Dehnen auf die Ruhespannung des Muskels?", a:["Sie sinkt nur kurzfristig","Sie sinkt dauerhaft","Sie steigt","Keine Wirkung, auch nicht kurzfristig"], e:"Langfristig ist keine Senkung möglich."},
{q:"Welche Dehnform für eine Kunstturnerin, die mehr Amplitude braucht?", a:["regelmässig statisch oder PNF (CR), nicht direkt vor Schnellkraftteilen","nur dynamisch vor dem Wettkampf","gar nicht dehnen","nur Krafttraining"], e:"Langfristige Beweglichkeit braucht regelmässiges Dehnen."},
{q:"Wie stark ist Beweglichkeit genetisch geprägt?", a:["stark, sie ist weitgehend konstitutionell","gar nicht","nur bei Männern","nur im Alter"], e:"Biologischer Aspekt aus den Folien."}
]}
};

// Offene Prüfungsfragen mit Musterlösung
const OPEN = {
e: [
{q:"Erkläre, warum ATP laufend resynthetisiert werden muss, und nenne die Wege der Resynthese.", a:"Der Muskel speichert nur ca. 6 mmol/kg ATP, das reicht bei maximaler Belastung 2-3 s. Resynthese über: Kreatinphosphat (anaerob alaktazid, bis ca. 10 s), anaerobe Glykolyse (anaerob laktazid, ca. 45-90 s, 2 ATP pro Glukose), aerobe Glykolyse (bis ca. 90 min, 30-32 ATP), Fettsäureoxidation (Stunden)."},
{q:"Vergleiche anaerobe und aerobe Glykolyse (Sauerstoff, Produkte, ATP-Ausbeute, Dauer, Geschwindigkeit).", a:"Anaerob: ohne O₂, Glykogen → Laktat + Energie, 2 ATP pro Glukose, schnell, dominiert ca. 45-90 s. Aerob: mit O₂, Glukose wird vollständig abgebaut, 30-32 ATP, langsamer, braucht ca. 2 min Anlauf, bis ca. 90 min."},
{q:"Erkläre Entstehung und Bedeutung von Laktat sowie Ursache und Folgen der metabolischen Azidose.", a:"Bei Sauerstoffmangel wird H⁺ in der Glykolyse auf Pyruvat übertragen → Laktat. Laktat ist kein Abfall: Herz, Leber, unbelastete Muskeln bauen es ab und nutzen es (Glukose, Energie), es ist Signalmolekül und dient zur Leistungsdiagnostik. H⁺ entsteht bei jeder ATP-Hydrolyse, unter anaeroben Bedingungen sammelt es sich an → pH sinkt (Azidose) → Muskelkontraktion gehemmt → Leistungsabbruch."},
{q:"Ordne zu und begründe: 100-m-Lauf, 800-m-Lauf, Marathon, Fussballspiel.", a:"100 m: 25 % ATP/KrP, 70 % anaerob laktazid (kurz, maximal). 800 m: 60 % aerob, 30 % laktazid (ca. 2 min, sehr intensiv). Marathon: 95-98 % aerob, Glukose und Fett (lang, tiefere Intensität). Fussball: aerobe Grundlage über 90 min, dazu KrP und anaerobe Glykolyse für Sprints."}
],
l: [
{q:"Beschreibe das Schwellenkonzept mit typischen Laktatwerten.", a:"Ruhe 0.7-1.8 mmol/l. AS ca. 2 mmol/l: höchste Belastung, bei der Laktat noch fast Ruhewert ist, erster Anstieg, bis hier v.a. aerob. ANS (maxLSS) ca. 4 mmol/l (individuell 2.3-6.8): höchste Belastung mit Gleichgewicht von Laktatbildung und -abbau, danach exponentieller Anstieg. Ausbelastung über 8, Abbruch bis über 20 mmol/l."},
{q:"Nenne Ziel, Nutzen, Aufbau, Vorgehen und Messgrössen des Laktatstufentests.", a:"Ziel: ANS über Blutlaktat bestimmen, aerobe Ausdauerleistungsfähigkeit bestimmen. Nutzen: Trainingsbereiche aus Laktat und HF ableiten. Aufbau: Maximaltest, alle 3 min +30 W (Velo) bzw. +1.2 km/h (Laufband) bis Ausbelastung. Vorgehen: Blut am Ohrläppchen/Finger vor, während, nach der Belastung (Ende jeder Stufe). Messgrössen: Leistung, Laktat, HF, Borg."},
{q:"Eine Testperson bricht ab mit Borg 19, Laktat 9.1 mmol/l, ohne Beschwerden. War sie ausbelastet? Unterscheide Ausbelastungs- und Abbruchkriterien.", a:"Ja: Borg ≥ 18 und Laktat über 8 mmol/l sind Ausbelastungskriterien (dazu max. HF, Eindruck der Testleitung). Ausbelastungskriterien zeigen, dass der Test maximal und gültig war. Abbruchkriterien sind Sicherheitsgründe zum Stoppen: subjektive Erschöpfung, Angina pectoris, zunehmende Atemnot, Schwindel/Unwohlsein/Übelkeit."},
{q:"Beschreibe die modifizierte Dmax-Methode Schritt für Schritt.", a:"1. Laktat gegen Leistung eintragen, Kurve zeichnen. 2. AS = Messpunkt vor dem ersten Anstieg von mehr als 0.4 mmol/l. 3. Gerade von der AS zum letzten Messpunkt. 4. ANS = Punkt der Kurve mit grösstem senkrechtem Abstand zur Geraden. 5. Leistung und HF bei beiden Schwellen ablesen."},
{q:"Probandin 2: AS 130 W / HF 155, ANS 177 W / HF 171. Gib eine Trainingsempfehlung für 3 Trainings pro Woche und begründe.", a:"Polarisiert 80/20: 2 × Grundlage 45-90 min unter der AS (ca. HF 145-155, sprechen möglich) → aerobe Basis, AS steigt. 1 × Intervalle um/über der ANS (z.B. 3 × 8-10 min bei 170-180 W, HF 167-172, oder 4 × 4 min bei 190-200 W) → ANS und VO₂max steigen. Über der ANS kein Gleichgewicht, Laktat/H⁺ steigen, darum nur kurze Intervalle mit Pause. GA2 nicht zum Standardtempo machen. Hinweis: Test endete bei Borg 15, Werte daher weniger sicher."},
{q:"Wie verändern Ausdauertraining, Training an der ANS und Training über der ANS die Laktatkurve nach 8 Wochen?", a:"Allgemein: Kurve nach rechts, bei gleicher Leistung weniger Laktat und tiefere HF. Lockeres Training (Zone 1): AS steigt, besserer Fettstoffwechsel, mehr Kapillaren/Mitochondrien. An der ANS (Zone 2): ANS steigt, mehr Säuretoleranz und Pufferkapazität. Über der ANS (Zone 3): VO₂max steigt, mehr anaerobe Kapazität, höhere Laktatwerte werden toleriert."}
],
g: [
{q:"Nenne die Faktoren der sportlichen Leistungsfähigkeit und wende sie auf Tennis an.", a:"Konditionell (Schnelligkeit für Antritte, Ausdauer für lange Matches), koordinativ-technisch (Schlagtechnik), taktisch (Spielzüge, Platzierung), psychisch (Konzentration bei Breakball), sozial/Umfeld (Trainer, Material), Anlagen/Gesundheit (Körpergrösse, Fasern)."},
{q:"Erkläre das Prinzip der Trainingsbelastung an einem Beispiel.", a:"Der Reiz muss wirksam sein: zu schwach = keine Anpassung, zu stark = Schaden. Beschreibung mit Intensität, Dauer, Umfang, Dichte, Häufigkeit. Beispiel 6 × 400 m in 90 s, 2 min Pause, 2× pro Woche: Intensität 90 s/400 m, Dauer 90 s, Umfang 2400 m, Dichte 90 s : 2 min, Häufigkeit 2."},
{q:"Nenne und erkläre drei Richtlinien des sportlichen Trainings.", a:"z.B. progressive Belastungssteigerung (schrittweise mehr, sonst Stagnation), optimale Relation Belastung/Erholung (neuer Reiz in der Superkompensation), Regelmässigkeit (sonst Rückbildung), Variation, Individualität, Spezifität, Periodisierung."}
],
a: [
{q:"Erkläre die Superkompensation und was bei optimal, zu früh und zu spät gesetzten Reizen passiert.", a:"Training senkt die Leistung unter das Ausgangsniveau, in der Erholung steigt sie zurück und darüber hinaus (Superkompensation), ohne neuen Reiz fällt sie zurück. Optimal (Reiz im Hoch): Leistung steigt treppenartig. Zu früh: Leistung sinkt langfristig (Übertraining). Zu spät: kein Fortschritt."},
{q:"Beschreibe die Intensitätsstufen 2 und 4 (Borg, Sprechregel, % HFmax, Energie, Wirkung, Methode).", a:"Stufe 2 locker: Borg 10-12, plaudern, 70-80 % HFmax, aerob, aerobe Kapazität, Dauermethode/extensive Intervalle. Stufe 4 hart, an der Schwelle: Borg 15-16, knapper Wortwechsel, 90-95 % HFmax, aerob-anaerober Übergang, aerobe Leistungsfähigkeit, intensive Intervalle/Wiederholung/Wettkampf."},
{q:"Vergleiche Dauer-, Intervall- und Wiederholungsmethode nach Belastung, Intensität und Pause und gib je ein Beispiel.", a:"Dauer: ununterbrochen 20 min bis Stunden, <70-90 %, keine Pause (45 min Dauerlauf). Intervall: Wechsel Belastung/Erholung, 60-80 % bzw. >90 %, lohnende Pause 15 s-10 min (8 × 3 min, 1 min Pause). Wiederholung: wenige Wdh, 90-100 % VO₂max, vollständige Erholung 4-30 min (8 × 1 min, 10 min Pause)."},
{q:"Plane mit dem polarisierten Modell eine Trainingswoche (3 Trainings) für den Silvesterlauf und begründe.", a:"80/20: 2 × Dauerlauf 30-60 min in Zone 1 (plaudern) für die Grundlage (AS, Fettstoffwechsel, Herz). 1 × Intervalle in Zone 3 (z.B. 8 × 1 min, 2 min Pause oder 4 × 4 min) für VO₂max. Zone 2 meiden. Zuerst Häufigkeit, dann Umfang, dann Intensität steigern, max. +10 % pro Woche."},
{q:"Warum sollte Ausdauer sportartspezifisch trainiert werden, und wann ist Alternativtraining sinnvoll?", a:"Anpassungen sind spezifisch: Muskeln, Bewegungsmuster und Energiesystem passen sich an die trainierte Bewegung an. Darum möglichst viel Zieldisziplin. Alternativ (Velo, Schwimmen) sinnvoll für Grundlagenausdauer, bei Verletzungen, zur Entlastung von Gelenken, Regeneration und Abwechslung."},
{q:"Nenne je ein Beispiel für mentale, sensorische, sensomotorische, emotionale und physische Belastung.", a:"Mental: Schachturnier. Sensorisch: Schiedsrichter 90 min konzentriert. Sensomotorisch: Bogenschiessen. Emotional: Penaltyschiessen. Physisch: Marathon."}
],
k: [
{q:"Nenne die 5 koordinativen Fähigkeiten und übertrage sie auf Fussball.", a:"Differenzierung: Pass genau dosieren. Orientierung: Position zu Ball, Gegner, Tor erkennen. Reaktion: Goalie bei Ablenker. Rhythmisierung: Anlauf beim Penalty, Dribbling. Gleichgewicht: Zweikampf, Schuss auf einem Bein."},
{q:"Erkläre das Konzept der sensiblen Phasen.", a:"Sensible Phasen sind Altersabschnitte, in denen eine Fähigkeit besonders gut trainierbar ist. Für koordinative Fähigkeiten ca. 7-12 Jahre (goldenes Lernalter). Ab ca. 14 werden ungenutzte Synapsen abgebaut (Pruning), darum früh vielseitig lernen."},
{q:"Unterscheide die drei Phasen des motorischen Lernens.", a:"Grobkoordination: Grundablauf, unter günstigen Bedingungen relativ fehlerfrei, nicht stabil, stark visuell. Feinkoordination: verfeinert, unter stabilen Bedingungen fast fehlerfrei, Empfindungen bewusst, kinästhetisch. Feinstkoordination: sicher auch unter wechselnden Bedingungen, variabel, Antizipation von Störungen."},
{q:"Ein Kind lernt Skifahren. Wende vier methodische Grundsätze an.", a:"Von Anfang an richtig (Neulernen einfacher als Umlernen). Vom Einfachen zum Schweren (flach, dann steiler). Vielfalt statt Einfalt (verschiedene Übungen, Gelände). Selbständig entdecken lassen mit Hilfestellung. Koordination ausgeruht am Anfang üben."}
],
f: [
{q:"Unterscheide konzentrisch, exzentrisch und isometrisch mit je einer Übung.", a:"Konzentrisch: Muskel verkürzt sich (Hantel hochheben). Exzentrisch: Muskel wird unter Spannung länger (Hantel langsam ablassen, Landung). Isometrisch: Länge bleibt gleich (Plank, Wandsitzen)."},
{q:"Unterscheide die vier Erscheinungsformen der Kraft und nenne je eine Sportart.", a:"Maximalkraft: höchstmögliche Kraft (Gewichtheben). Schnellkraft: hoher Kraftimpuls in kurzer Zeit (Handball-Wurf). Reaktivkraft: Dehnungs-Verkürzungs-Zyklus (Volleyball-Sprung). Kraftausdauer: Ermüdungswiderstand bei langen Kraftleistungen (Rudern)."},
{q:"Erkläre die kraftbestimmenden Faktoren Muskelquerschnitt, Fasertyp, intra- und intermuskuläre Koordination.", a:"Querschnitt: dicker = mehr Kraft. Fasertyp: FT schnell/kräftig, ST langsam/ausdauernd, ab 30 % Last auch FT. Intramuskulär: Anzahl gleichzeitig aktivierter Fasern in einem Muskel. Intermuskulär: Zusammenspiel Agonist, Synergist, Antagonist."},
{q:"Wähle eine Methode und begründe: a) Muskelaufbau, b) mehr Sprungkraft im Volleyball, c) Ruderer.", a:"a) Hypertrophie: 75-85 %, 5-8 Wdh, lange Pausen, 10-25 Serien pro Muskelgruppe pro Woche. b) Schnellkraft (50-70 %, 6-8 explosiv, 3-5 min) oder plyometrisch (Niedersprünge 8-10, 3-5 Serien, 5-8 min), weil Kraft in kurzer Zeit und DVZ. c) Kraftausdauer-Circuit: 35-65 %, 25-50 Wdh, kurze Pausen."},
{q:"Erkläre den Zusammenhang zwischen Intensität, Umfang und Erholung im Krafttraining.", a:"Je höher die Intensität, desto weniger Wiederholungen sind möglich und desto länger muss die Pause sein (IK: 85-100 %, 1-5 Wdh, 3-5 min), damit der Muskel wieder maximal aktiviert werden kann. Tiefe Intensität: viele Wdh, kurze Pausen (Kraftausdauer)."}
],
s: [
{q:"Unterscheide einfache und komplexe Reaktion mit Beispielen und beschreibe die Schritte der komplexen Reaktion.", a:"Einfach: bekannter Reiz, vorgegebene Antwort (Startschuss, 0.10-0.15 s). Komplex: mehrere Reize/Antworten (Goalie, Return, 0.20-0.40 s). Schritte: Wahrnehmung (selektive Aufmerksamkeit), Antizipation (wenn-dann), Entscheidung unter Zeitdruck."},
{q:"Erkläre die Phasen des 100-m-Sprints.", a:"Start: einfache Reaktionsschnelligkeit. Beschleunigung: Schnell- und Maximalkraft. Topspeed: zyklische Frequenzschnelligkeit (Maximalgeschwindigkeit). Schlussspurt: Schnelligkeitsausdauer, Geschwindigkeit halten."},
{q:"Beschreibe den motorischen und kognitiven Anteil der Agilität.", a:"Motorisch: schneller Richtungswechsel, abhängig von Geschwindigkeit vor dem Wechsel, Abbremskraft, Abdruckkraft und Körperorientierung. Kognitiv: über sensorische Rückmeldung schnell eine Entscheidung treffen (z.B. auf Gegner reagieren)."},
{q:"Plane ein Schnelligkeitstraining.", a:"Gutes Aufwärmen mit Laufschule, dann Wiederholungsmethode am Anfang des Trainings: maximale Intensität, 2-3 Serien à 3-6 Wdh (z.B. 30 m fliegend mit Zeitmessung), vollständige Erholung (2-3 min zwischen Läufen, länger zwischen Serien), abbrechen wenn Tempo oder Qualität nachlassen."},
{q:"Unterscheide zyklische Frequenz- und azyklische Sequenzschnelligkeit.", a:"Frequenz (zyklisch): gleiche, sich wiederholende Bewegungen maximal schnell (Laufen, Radfahren). Sequenz (azyklisch): einmalige Bewegung maximal schnell (Smash, Wurf)."}
],

function startQuiz(t, set) {
  let qs, title;
  if (t === "all") { qs = shuffle(TOPICS.flatMap(x => allQ(x.id))).slice(0, 15); title = "Gemischt, alle Themen"; }
  else if (set === "Z") { qs = shuffle(allQ(t)).slice(0, 8); title = `${topic(t).title} · Zufall`; }
  else if (set === "F") { const ids = S.get("wrong_" + t, []); qs = shuffle(allQ(t).filter(q => ids.includes(q.id))); title = `${topic(t).title} · Fehler wiederholen`;
    if (!qs.length) { app().innerHTML = `<h1>${title}</h1><p class="lead">Keine offenen Fehler bei diesem Thema. Stark.</p><p><a class="btn" href="#quiz/${t}/Z">Zufallsquiz</a> <a class="btn ghost" href="#quiz">Zur Übersicht</a></p>${nextFehler(t)}`; return; } }
  else { qs = shuffle(setQ(t, set)); title = `${topic(t).title} · Quiz ${set}`; }
  runQuiz(qs, title, (score, wrongIds, rightIds) => {
    if (t !== "all" && ["A", "B", "C"].includes(set)) { const b = best(t, set); if (b === null || score > b) S.set(`best_${t}_${set}`, score); }
    // Fehlerliste pflegen
    const byT = {}; qs.forEach(q => byT[q.t] = byT[q.t] || S.get("wrong_" + q.t, []));
    wrongIds.forEach(id => { const tt = id.split("-")[0]; if (!byT[tt].includes(id)) byT[tt].push(id); });
    rightIds.forEach(id => { const tt = id.split("-")[0]; byT[tt] = byT[tt].filter(x => x !== id); });
    Object.keys(byT).forEach(tt => S.set("wrong_" + tt, byT[tt]));
  }, t, set);
}
function nextFehler(t) { const others = TOPICS.filter(x => S.get("wrong_" + x.id, []).length); return others.length ? `<p class="small">Offene Fehler bei: ${others.map(x => `<a href="#quiz/${x.id}/F">${x.title}</a>`).join(", ")}</p>` : ""; }

function runQuiz(qs, title, onEnd, t, set) {
  let i = 0, right = 0; const wrong = [], ok = [], log = [];
  function show() {
    const q = qs[i]; const opts = shuffle(q.a.map((x, k) => ({ x, ok: k === 0 })));
    app().innerHTML = `<p class="crumb"><a href="#quiz">Quiz</a> / ${esc(title)}</p>
    <div class="qhead"><span>Frage ${i + 1} von ${qs.length}</span><span>${right} richtig</span></div>
    <div class="bar"><div style="width:${i / qs.length * 100}%"></div></div>
    <div class="qcard"><h2>${esc(q.q)}</h2>${t === "all" ? `<p class="small">${topic(q.t).title}</p>` : ""}
    <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span>${"ABCD"[k]}</span>${esc(o.x)}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
    app().querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      if (app().querySelector(".opts").dataset.done) return; app().querySelector(".opts").dataset.done = 1;
      const o = opts[+b.dataset.k];
      app().querySelectorAll(".opt").forEach((bb, k) => { if (opts[k].ok) bb.classList.add("right"); });
      if (o.ok) { right++; ok.push(q.id); } else { b.classList.add("wrong"); wrong.push(q.id); }
      log.push({ q, ok: o.ok, chosen: o.x });
      $("#fb").innerHTML = `<div class="fb ${o.ok ? "y" : "n"}"><b>${o.ok ? "Richtig." : "Falsch."}</b> ${esc(q.e)}</div>
      <button class="btn" id="nx">${i + 1 < qs.length ? "Weiter" : "Auswertung"}</button>`;
      $("#nx").focus();
      $("#nx").addEventListener("click", () => { i++; i < qs.length ? show() : end(); });
    }));
  }
  function end() {
    const score = Math.round(right / qs.length * 100);
    onEnd(score, wrong, ok);
    const note = Math.round((1 + 5 * right / qs.length) * 4) / 4;
    app().innerHTML = `<p class="crumb"><a href="#quiz">Quiz</a> / ${esc(title)}</p><h1>${score} %</h1>
    <p class="lead">${right} von ${qs.length} richtig · entspricht ungefähr Note ${note.toFixed(2).replace(/0$/, "")}. ${score >= 90 ? "Sehr gut, dieses Quiz sitzt." : score >= 80 ? "Gut. Lies die Fehler unten nach und mach später ein anderes Quiz." : "Lies die Fehler unten im Kapitel nach und mach das Quiz morgen nochmals."}</p>
    <p>${wrong.length ? `<a class="btn" href="#quiz/${t}/F">Nur Fehler wiederholen</a>` : ""} ${t !== "all" ? `<a class="btn ghost" href="#quiz/${t}/Z">Zufallsquiz</a> <a class="btn ghost" href="#guide/${t}">Kapitel</a>` : ""} <a class="btn ghost" href="#quiz">Übersicht</a></p>
    ${wrong.length ? `<h2>Deine Fehler</h2>${log.filter(l => !l.ok).map(l => `<div class="rev"><b>${esc(l.q.q)}</b><br><span class="n">Deine Antwort: ${esc(l.chosen)}</span><br><span class="y">Richtig: ${esc(l.q.a[0])}</span><br><span class="small">${esc(l.q.e)}</span></div>`).join("")}` : ""}`;
    if (wrong.length) { const a = app().querySelector('a[href$="/F"]'); if (a && t === "all") a.remove(); }
  }
  show();
}

// ---------- Dmax ----------
function fit3(xs, ys) { const n = 4; const A = [...Array(n)].map(() => Array(n + 1).fill(0));
  for (let i = 0; i < xs.length; i++) { const p = [1, xs[i], xs[i] ** 2, xs[i] ** 3]; for (let r = 0; r < n; r++) { for (let c = 0; c < n; c++) A[r][c] += p[r] * p[c]; A[r][n] += p[r] * ys[i]; } }
  for (let i = 0; i < n; i++) { let m = i; for (let k = i + 1; k < n; k++) if (Math.abs(A[k][i]) > Math.abs(A[m][i])) m = k; [A[i], A[m]] = [A[m], A[i]]; for (let k = 0; k < n; k++) if (k !== i) { const f = A[k][i] / A[i][i]; for (let c = i; c <= n; c++) A[k][c] -= f * A[i][c]; } }
  return A.map((r, i) => r[n] / r[i]); }
function dmax(ds) {
  const { x, y, hf } = ds; let as = 0;
  for (let i = 1; i < y.length; i++) if (y[i] - y[i - 1] > 0.4) { as = i - 1; break; }
  const x0 = x[0], span = x[x.length - 1] - x[0]; const co = fit3(x.map(v => (v - x0) / span), y);
  const f = v => { const t = (v - x0) / span; return co[0] + co[1] * t + co[2] * t * t + co[3] * t ** 3; };
  const ax = x[as], ay = y[as], lx = x[x.length - 1], ly = y[y.length - 1]; let bx = ax, bd = 0;
  for (let k = 0; k <= 2000; k++) { const v = ax + (lx - ax) * k / 2000; const d = ay + (ly - ay) * (v - ax) / (lx - ax) - f(v); if (d > bd) { bd = d; bx = v; } }
  const hfAt = v => { for (let i = 1; i < x.length; i++) if (v <= x[i]) return hf[i - 1] + (hf[i] - hf[i - 1]) * (v - x[i - 1]) / (x[i] - x[i - 1]); return hf[hf.length - 1]; };
  return { as, ax, ay, ahf: hf[as], bx, by: f(bx), bhf: hfAt(bx), f, lx, ly };
}
function viewDmax(k) {
  const ds = DMAX[k]; const r = dmax(ds); const step = S.get("dstep_" + k, 0);
  const W = 520, H = 300, L = 45, B = 260, T = 15, R = 505;
  const xmin = ds.x[0] - (ds.x[1] - ds.x[0]) * 0.5, xmax = ds.x[ds.x.length - 1] + (ds.x[1] - ds.x[0]) * 0.5, ymax = Math.ceil(Math.max(...ds.y) + 1);
  const X = v => L + (v - xmin) / (xmax - xmin) * (R - L), Y = v => B - v / ymax * (B - T);
  let g = `<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" class="ax"/><line x1="${L}" y1="${B}" x2="${L}" y2="${T}" class="ax"/>`;
  for (let v = 0; v <= ymax; v++) g += `<line x1="${L}" y1="${Y(v)}" x2="${R}" y2="${Y(v)}" class="grid"/><text x="${L - 8}" y="${Y(v) + 4}" class="lb" text-anchor="end">${v}</text>`;
  ds.x.forEach(v => g += `<text x="${X(v)}" y="${B + 16}" class="lb" text-anchor="middle">${v}</text>`);
  g += `<text x="${R}" y="${B + 32}" class="lb" text-anchor="end">Leistung (${ds.unit})</text><text x="${L + 6}" y="${T + 10}" class="lb">Laktat (mmol/l)</text>`;
  let pts = ds.x.map((v, i) => `${X(v)},${Y(ds.y[i])}`).join(" ");
  g += `<polyline points="${pts}" class="c3" fill="none"/>` + ds.x.map((v, i) => `<circle cx="${X(v)}" cy="${Y(ds.y[i])}" r="4" class="pt"/>`).join("");
  if (step >= 1) g += `<circle cx="${X(r.ax)}" cy="${Y(r.ay)}" r="7" class="mark"/><line x1="${X(r.ax)}" y1="${B}" x2="${X(r.ax)}" y2="${T}" class="dash"/><text x="${X(r.ax) - 4}" y="${T + 12}" class="lb" text-anchor="end">AS</text>`;
  if (step >= 2) g += `<line x1="${X(r.ax)}" y1="${Y(r.ay)}" x2="${X(r.lx)}" y2="${Y(r.ly)}" class="c1"/>`;
  if (step >= 3) { let sm = ""; for (let k2 = 0; k2 <= 60; k2++) { const v = ds.x[0] + (ds.x[ds.x.length - 1] - ds.x[0]) * k2 / 60; sm += `${X(v)},${Y(r.f(v))} `; }
    const ly = r.ay + (r.ly - r.ay) * (r.bx - r.ax) / (r.lx - r.ax);
    g += `<polyline points="${sm}" class="c4" fill="none"/><line x1="${X(r.bx)}" y1="${Y(ly)}" x2="${X(r.bx)}" y2="${Y(r.by)}" class="c2"/><circle cx="${X(r.bx)}" cy="${Y(r.by)}" r="7" class="mark"/><line x1="${X(r.bx)}" y1="${B}" x2="${X(r.bx)}" y2="${T}" class="dash"/><text x="${X(r.bx) + 6}" y="${T + 12}" class="lb">ANS</text>`; }
  const fmt = v => ds.unit === "W" ? Math.round(v) : v.toFixed(1);
  const steps = ["Finde zuerst die aerobe Schwelle.", `Aerobe Schwelle: ${fmt(r.ax)} ${ds.unit}, ${r.ay} mmol/l, HF ${r.ahf}. Der erste Anstieg über 0.4 mmol/l kommt danach (${r.ay} → ${ds.y[r.as + 1]}).`, "Gerade von der AS zum letzten Messpunkt gezogen.", `Anaerobe Schwelle: ca. ${fmt(r.bx)} ${ds.unit}, ${r.by.toFixed(1)} mmol/l, HF ca. ${Math.round(r.bhf)}. Hier ist der Abstand zwischen Gerade und Kurve am grössten (grüne Linie = geglättete Kurve wie in der Excel-Auswertung).`];
  app().innerHTML = `<h1>Dmax-Trainer</h1>
  <p class="lead">Übe die modifizierte Dmax-Methode. Am besten zuerst auf Papier: Punkte eintragen, AS mit der 0.4-Regel, Gerade, grösster rechtwinkliger Abstand. Dann hier deine Werte eingeben und prüfen.</p>
  <div class="tabs">${DMAX.map((d, i) => `<a href="#dmax/${i}" class="${i === k ? "on" : ""}">${d.name}</a>`).join("")}</div>
  <div class="tw"><table class="data"><tr><th>Stufe</th>${ds.x.map((v, i) => `<td>${i + 1}</td>`).join("")}</tr><tr><th>Leistung (${ds.unit})</th>${ds.x.map(v => `<td>${v}</td>`).join("")}</tr><tr><th>Laktat (mmol/l)</th>${ds.y.map(v => `<td>${v}</td>`).join("")}</tr><tr><th>HF</th>${ds.hf.map(v => `<td>${v}</td>`).join("")}</tr></table></div>
  <svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>
  <div class="guess"><label>Deine AS (${ds.unit}) <input id="gas" type="number" step="any"></label><label>Deine ANS (${ds.unit}) <input id="gans" type="number" step="any"></label><button class="btn" id="chk">Prüfen</button></div>
  <div id="gres"></div>
  <p><b>Schritt ${step} von 3:</b> ${steps[step]}</p>
  <p>${step < 3 ? `<button class="btn" id="nst">Nächsten Schritt zeigen</button>` : ""} <button class="btn ghost" id="rst">Zurücksetzen</button></p>`;
  const nst = $("#nst"); if (nst) nst.onclick = () => { S.set("dstep_" + k, step + 1); viewDmax(k); };
  $("#rst").onclick = () => { S.set("dstep_" + k, 0); viewDmax(k); };
  $("#chk").onclick = () => { const a = parseFloat($("#gas").value), b = parseFloat($("#gans").value); const tol = ds.unit === "W" ? 10 : 0.4; let out = [];
    if (!isNaN(a)) out.push(Math.abs(a - r.ax) < 0.01 ? `<span class="y">AS richtig: ${fmt(r.ax)} ${ds.unit}.</span>` : `<span class="n">AS stimmt nicht. Tipp: Suche den ersten Sprung über 0.4 mmol/l und nimm den Punkt davor.</span>`);
    if (!isNaN(b)) out.push(Math.abs(b - r.bx) <= tol ? `<span class="y">ANS passt (Lösung ca. ${fmt(r.bx)} ${ds.unit}, ±${tol} ${ds.unit} ist auf Papier ok).</span>` : `<span class="n">ANS liegt nicht nahe genug. Tipp: Geodreieck rechtwinklig zur Geraden, wo ist der Abstand zur Kurve am grössten?</span>`);
    $("#gres").innerHTML = `<div class="fb">${out.join("<br>")}</div>`; };
}

function viewSim() {
  const hist = S.get("simhist", []);
  app().innerHTML = `<h1>Prüfungssimulation</h1>
  <p class="lead">22 Multiple-Choice-Fragen, gewichtet wie die Prüfung (Energie, Laktat und Ausdauer am meisten), dazu 4 offene Fragen. Jede Simulation zieht andere Fragen. Ohne Unterlagen, Timer läuft 60 min.</p>
  <p><button class="btn" id="go">Simulation starten</button></p>
  ${hist.length ? `<h2>Bisherige Simulationen</h2><div class="tw"><table><tr><th>Datum</th><th>Multiple Choice</th><th>Offene Fragen</th></tr>${hist.map(h => `<tr><td>${h.d}</td><td>${h.mc} %</td><td>${h.op}</td></tr>`).join("")}</table></div>` : ""}`;

function runSim() {
  const W = { e: 4, l: 4, a: 4, f: 3, k: 2, s: 2, b: 2, g: 1 };
  const mc = shuffle(Object.entries(W).flatMap(([t, n]) => shuffle(allQ(t)).slice(0, n)));
  const ot = shuffle(["e", "l", "a", "f", "k", "s", "b"]).slice(0, 4); const op = ot.map(t => ({ t, ...shuffle(OPEN[t])[0] }));
  const start = Date.now(); const ans = {};

  <h2>Teil 1: Multiple Choice</h2>
  ${mc.map((q, i) => { const o = shuffle(q.a.map((x, k) => ({ x, ok: k === 0 }))); q._o = o;
    return `<div class="simq"><b>${i + 1}. ${esc(q.q)}</b>${o.map((x, k) => `<label class="sopt"><input type="radio" name="q${i}" value="${k}"> ${esc(x.x)}</label>`).join("")}</div>`; }).join("")}
  <h2>Teil 2: Offene Fragen</h2><p class="small">Schreib die Antworten auf Papier. Nach dem Abgeben siehst du die Musterlösung und bewertest dich selbst.</p>
  ${op.map((o, i) => `<div class="simq"><b>${i + 1}. ${esc(o.q)}</b> <span class="small">(${topic(o.t).short})</span></div>`).join("")}
  <p><button class="btn" id="sub">Abgeben</button></p>`;
  window.__timer = setInterval(() => { const s = Math.max(0, 3600 - Math.floor((Date.now() - start) / 1000)); const el = $("#tm"); if (el) el.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 1000);
  $("#sub").onclick = () => {
    clearInterval(window.__timer); window.__timer = null;
    let right = 0; const wrongIds = [], okIds = [];
    const res = mc.map((q, i) => { const v = app().querySelector(`input[name=q${i}]:checked`); const ok = v && q._o[+v.value].ok; if (ok) { right++; okIds.push(q.id); } else wrongIds.push(q.id); return { q, ok, chosen: v ? q._o[+v.value].x : "keine Antwort" }; });
    const byT = {}; mc.forEach(q => byT[q.t] = byT[q.t] || S.get("wrong_" + q.t, []));
    wrongIds.forEach(id => { const tt = id.split("-")[0]; if (!byT[tt].includes(id)) byT[tt].push(id); });
    okIds.forEach(id => { const tt = id.split("-")[0]; byT[tt] = byT[tt].filter(x => x !== id); });
    Object.keys(byT).forEach(tt => S.set("wrong_" + tt, byT[tt]));
    const pct = Math.round(right / mc.length * 100);
    const mins = Math.round((Date.now() - start) / 60000);
    app().innerHTML = `<h1>Auswertung</h1><p class="lead">Multiple Choice: ${right} von ${mc.length} richtig (${pct} %) in ${mins} min. Bewerte jetzt die offenen Fragen.</p>
    ${op.map((o, i) => `<div class="drawcard"><b>${i + 1}. ${esc(o.q)}</b><p>${esc(o.a)}</p><div class="rate" data-i="${i}">Wie viel hattest du? <button class="btn sm" data-v="1">alles</button> <button class="btn sm" data-v="0.5">die Hälfte</button> <button class="btn sm" data-v="0">wenig</button></div></div>`).join("")}
    <div id="fin"></div>
    <h2>Multiple Choice: Fehler</h2>${res.filter(r => !r.ok).map(r => `<div class="rev"><b>${esc(r.q.q)}</b> <span class="small">(${topic(r.q.t).short})</span><br><span class="n">Deine Antwort: ${esc(r.chosen)}</span><br><span class="y">Richtig: ${esc(r.q.a[0])}</span><br><span class="small">${esc(r.q.e)}</span></div>`).join("") || "<p>Keine Fehler.</p>"}
    <p class="small">Falsche Fragen sind jetzt bei den jeweiligen Themen unter "Fehler wiederholen" gespeichert.</p>`;
    const rates = {};
    app().querySelectorAll(".rate button").forEach(b => b.onclick = () => { const i = b.parentElement.dataset.i; rates[i] = +b.dataset.v; b.parentElement.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on");
      if (Object.keys(rates).length === op.length) { const os = Object.values(rates).reduce((a, c) => a + c, 0) / op.length; const tot = 0.6 * (right / mc.length) + 0.4 * os; const note = Math.round((1 + 5 * tot) * 4) / 4;
        $("#fin").innerHTML = `<div class="fb"><b>Geschätzte Note: ${note.toFixed(2).replace(/0$/, "")}</b> (MC 60 %, offene Fragen 40 % gewichtet). ${note >= 5.75 ? "Du bist ready." : note >= 5 ? "Fast. Fehler nachlernen und 'Fehler wiederholen' machen." : "Kapitel mit den meisten Fehlern nochmals lesen, dann neue Simulation."}</div>`;
        const h = S.get("simhist", []); const d = new Date(); h.unshift({ d: `${d.getDate()}.${d.getMonth() + 1}. ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`, mc: pct, op: `${Math.round(os * 100)} % · Note ca. ${note}` }); S.set("simhist", h.slice(0, 10)); } });
  };
}

// ---------- Merkblatt ----------
function viewMerk() { app().innerHTML = `<h1>Merkblatt</h1><p class="lead">Für die letzten Tage und den Prüfungsmorgen. Alles, was du auswendig wissen musst, auf einer Seite.</p>${MERK}`; }

route();
</script>
